name: CI

on:
  pull_request:
  push:
    branches: [main]

# Solo una revisión nueva del mismo PR sustituye a la anterior; los push de main se completan.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codigo:
    runs-on: ubuntu-latest
    # Suele tardar 2-3 min (máx. 3.5 min en 52 corridas); un cuelgue falla solo (OL-344).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Compilación sin variables: también se conserva la compilación contra el respaldo dentro de medir.
      - run: npm run build

  contratos:
    runs-on: ubuntu-latest
    # Suele tardar 3-4 min (máx. 4 min en 52 corridas); un cuelgue falla solo (OL-344).
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  interfaz:
    runs-on: ubuntu-latest
    # Suele tardar 6-8 min (máx. 23 min en 52 corridas, con un apt lento). El tope corta un cuelgue en vez de esperar
    # las 6 h que GitHub da por omisión (OL-344).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Los estilos, componentes y DOM siguen comprobándose con sus presupuestos y cuarentenas vigentes.
      - run: npm run inventario
      # OL-344: el 7 de octubre este paso se colgó tres veces en el `apt-get update` que lanzaba `--with-deps`; el 22 de
      # octubre un espejo a 50 kB/s agotó los tres intentos bajando las mismas fuentes de siempre (OL-449). Ahora el
      # navegador y los .deb de lo que la imagen no trae se guardan en la caché de GitHub, con la versión de
      # playwright-core y la imagen en la clave: con la caché llena no se usa apt ni la red de Ubuntu. apt solo corre
      # la primera vez o cuando cambia la clave, con el mismo tope y reintento de antes (ver `scripts/ops/ci-chromium.sh`).
      - name: Clave de la caché de Chromium
        id: clave-chromium
        run: echo "clave=chromium-$ImageOS-pw$(node -p "require('playwright-core/package.json').version")-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5.0.5
        id: cache-chromium
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/debs-chromium
          key: ${{ steps.clave-chromium.outputs.clave }}
      - name: Chromium y sus dependencias del sistema (de la caché; apt con tope y reintento solo si falta)
        timeout-minutes: 15
        run: bash scripts/ops/ci-chromium.sh
      # Se guarda en cuanto queda instalado, aunque luego fallen las pruebas (el `post` de actions/cache solo guarda si todo
      # el trabajo pasa).
      - if: steps.cache-chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5.0.5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/debs-chromium
          key: ${{ steps.clave-chromium.outputs.clave }}
      - name: Pruebas de componentes en Chromium
        run: npm run test:componentes
        timeout-minutes: 10
      # Suele tardar 2-3.5 min.
      - run: npm run medir
        timeout-minutes: 10

  # Main exige este nombre. Un trabajo omitido o cancelado nunca equivale a una comprobación correcta.
  verificar:
    runs-on: ubuntu-latest
    needs: [codigo, contratos, interfaz]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Comprobar todos los resultados
        env:
          CODIGO: ${{ needs.codigo.result }}
          CONTRATOS: ${{ needs.contratos.result }}
          INTERFAZ: ${{ needs.interfaz.result }}
        run: |
          for resultado in "$CODIGO" "$CONTRATOS" "$INTERFAZ"; do
            if [ "$resultado" != success ]; then
              echo "La CI exige que los tres trabajos terminen correctamente. Resultado: $resultado"
              exit 1
            fi
          done
