name: CI

on:
  pull_request:
  push:
    branches: [main]

# Solo una revisión nueva del mismo PR sustituye a la anterior; los push de main se completan.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codigo:
    runs-on: ubuntu-latest
    # Suele tardar 2-3 min (máx. 3.5 min en 52 corridas); un cuelgue falla solo (OL-344).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Compilación sin variables: también se conserva la compilación contra el respaldo dentro de medir.
      - run: npm run build

  contratos:
    runs-on: ubuntu-latest
    # Suele tardar 3-4 min (máx. 4 min en 52 corridas); un cuelgue falla solo (OL-344).
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  interfaz:
    runs-on: ubuntu-latest
    # Suele tardar 6-8 min (máx. 23 min en 52 corridas, con un apt lento). El tope corta un cuelgue en vez de esperar
    # las 6 h que GitHub da por omisión (OL-344).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Los estilos, componentes y DOM siguen comprobándose con sus presupuestos y cuarentenas vigentes.
      - run: npm run inventario
      # OL-344: el 7 de octubre este paso se colgó tres veces (22 min, 46 min y 6 h, hasta cancelarlo) en el
      # `apt-get update` que lanza `--with-deps`: el espejo de Azure no respondía y, tras pasar a archive.ubuntu.com,
      # apt se quedaba callado para siempre después de «noble-security InRelease». Suele tardar 20 s. Cada intento
      # tiene su propio tope (`timeout` corta también a sus hijos, sudo y apt-get) y se reintenta hasta tres veces;
      # apt se rinde antes con sus propios plazos. La instalación es la misma de siempre.
      - name: Chromium y sus dependencias del sistema (con tope y reintento)
        timeout-minutes: 15
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-tope-ci > /dev/null
          for intento in 1 2 3; do
            if timeout --kill-after=15s 4m npx playwright-core install --with-deps --only-shell chromium; then exit 0; fi
            echo "::warning::La instalación de Chromium no terminó en el intento $intento (apt colgado o caído); se reintenta."
            # Un apt-get que sobreviva al corte dejaría tomado el candado de apt para el siguiente intento.
            sudo pkill -x apt-get || true
            sleep 5
          done
          exit 1
      - name: Pruebas de componentes en Chromium
        run: npm run test:componentes
        timeout-minutes: 10
      # Suele tardar 2-3.5 min.
      - run: npm run medir
        timeout-minutes: 10

  # Main exige este nombre. Un trabajo omitido o cancelado nunca equivale a una comprobación correcta.
  verificar:
    runs-on: ubuntu-latest
    needs: [codigo, contratos, interfaz]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Comprobar todos los resultados
        env:
          CODIGO: ${{ needs.codigo.result }}
          CONTRATOS: ${{ needs.contratos.result }}
          INTERFAZ: ${{ needs.interfaz.result }}
        run: |
          for resultado in "$CODIGO" "$CONTRATOS" "$INTERFAZ"; do
            if [ "$resultado" != success ]; then
              echo "La CI exige que los tres trabajos terminen correctamente. Resultado: $resultado"
              exit 1
            fi
          done
