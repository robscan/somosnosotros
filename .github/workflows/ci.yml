name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

      - run: npm run build

      # Protección de la interfaz (docs/rediseno/50 § 9): los estilos y el DOM medido, con el respaldo local de datos inventados
      # y sin ninguna llave. `medir` levanta el respaldo y la app por su cuenta y espera a que respondan.
      - run: npm run inventario
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm run medir
