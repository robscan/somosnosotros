<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lugar y dirección en el alta de evento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap">
<style>
  /* Tokens: los de globals.css de somosnosotros (línea gráfica firmada), como en cartel-aparte.html. */
  :root {
    color-scheme: light dark;
    --estudio: #ebeae6; --estudio-texto: #3b3a37; --estudio-suave: #8a8883;
    --fondo: #ffffff; --fondo-contenido: #f6f5f1; --fondo-suave: #f4f4f2; --fondo-miniatura: #e6e6e2;
    --texto: #1a1a1a; --texto-suave: #5c5c5c; --borde: #dcdcd8; --error: #b3261e;
    --primario: #0f6b7c; --primario-texto: #ffffff; --primario-suave: #e3f0f2;
    --fuente: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --ancho-titulo: "wdth" 75; --ancho-texto: "wdth" 80;
    --toque: 48px; --toque-min: 44px; --gutter: 20px; --radio: 12px; --alto-estado: 48px; --alto-barra: 56px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --estudio: #232321; --estudio-texto: #d9d7d1; --estudio-suave: #8f8d86; } }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--estudio); color: var(--estudio-texto); font-family: var(--fuente); font-variation-settings: var(--ancho-texto); font-optical-sizing: auto; padding: 24px 16px; min-height: 100vh; }
  button, input, textarea { font: inherit; color: inherit; }
  svg { width: 20px; height: 20px; flex: none; }
  .estudio { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; max-width: 1360px; margin: 0 auto; }
  .rotulo { flex: 0 0 100%; margin-bottom: 8px; color: var(--estudio-suave); font-size: 14px; line-height: 1.5; }
  .rotulo > span { display: block; max-width: 860px; margin-inline: auto; }
  .rotulo strong { display: block; color: var(--estudio-texto); font-weight: 700; font-variation-settings: var(--ancho-titulo); font-size: 22px; margin-bottom: 4px; }
  .rotulo em { font-style: normal; color: var(--estudio-texto); font-weight: 700; }
  .par { display: grid; gap: 10px; justify-items: center; }
  .par > figcaption { max-width: 390px; color: var(--estudio-suave); font-size: 13px; line-height: 1.45; text-align: left; }
  .par > figcaption b { display: block; color: var(--estudio-texto); font-size: 15px; font-weight: 700; font-variation-settings: var(--ancho-titulo); margin-bottom: 2px; }
  .telefono { position: relative; width: 390px; max-width: 100%; height: 844px; flex: none; overflow: hidden; border-radius: 40px; background: var(--fondo-contenido); color: var(--texto); box-shadow: 0 20px 60px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.08); }
  .estado-ios { height: var(--alto-estado); display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 4px; background: var(--fondo); font-size: 15px; font-weight: 600; }
  .pantalla { height: calc(844px - var(--alto-estado)); overflow-y: auto; padding: 0 var(--gutter) 40px; }
  .pantalla.con-teclado { display: flex; flex-direction: column; }

  .barra { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: var(--alto-barra); margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); background: var(--fondo); }
  .logotipo { grid-column: 2; font-size: 22px; font-weight: 800; font-variation-settings: var(--ancho-titulo); line-height: 1; }
  .cerrar-barra { grid-column: 3; justify-self: end; display: inline-grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--borde); border-radius: 50%; background: var(--fondo); }
  h1 { font-size: 26px; font-weight: 700; font-variation-settings: var(--ancho-titulo); line-height: 1.1; margin: 14px 0 14px; }

  /* El canon */
  .cartel { display: grid; grid-template-columns: 44px 1fr; grid-template-areas: "icono titulo" "icono detalle"; column-gap: 14px; align-items: center; width: 100%; min-height: 76px; margin-bottom: 24px; padding: 12px 16px; border: 1px solid var(--primario); border-radius: var(--radio); background: var(--primario-suave); text-align: left; }
  .cartel > .marco { grid-area: icono; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--primario); color: var(--primario-texto); }
  .cartel > .marco svg { width: 24px; height: 24px; }
  .cartel > b { grid-area: titulo; font-size: 17px; font-weight: 700; font-variation-settings: var(--ancho-titulo); }
  .cartel > small { grid-area: detalle; color: var(--texto-suave); font-size: 14px; line-height: 1.35; }
  .cartel.leido { margin-bottom: 14px; border-color: var(--borde); background: var(--fondo); }
  .cartel.leido > .marco { background: var(--fondo-miniatura); }
  .miniatura { grid-area: icono; width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: linear-gradient(135deg, #c94f7c, #f2a33c); }

  .campo { position: relative; display: grid; margin-bottom: 12px; }
  .campo > input { min-height: var(--toque); padding: 0 14px; border: 1px solid var(--borde); border-radius: var(--radio); background: var(--fondo); font-size: 17px; }
  .renglones { list-style: none; display: grid; gap: 8px; margin-bottom: 16px; }
  .resuelto { display: grid; grid-template-columns: 24px 1fr auto; grid-template-areas: "icono clave accion" "icono valor accion" "cuerpo cuerpo cuerpo"; column-gap: 12px; align-items: center; min-height: 60px; padding: 10px 14px; border: 1px solid var(--borde); border-radius: var(--radio); background: var(--fondo); }
  .resuelto.pendiente { border-style: dashed; }
  .resuelto.confirmar { border-style: solid; border-color: var(--primario); }
  .resuelto > svg { grid-area: icono; color: var(--texto-suave); }
  .resuelto > .clave { grid-area: clave; font-size: 13px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--texto-suave); }
  .resuelto > .valor { grid-area: valor; font-size: 17px; font-weight: 600; line-height: 1.2; }
  .resuelto > .valor.falta { color: var(--texto-suave); font-weight: 500; }
  .resuelto > .cambiar { grid-area: accion; min-height: var(--toque-min); padding: 0 8px; border: none; background: none; color: var(--primario); font-size: 15px; font-weight: 700; }
  .accion { grid-area: accion; display: inline-grid; place-items: center; width: var(--toque-min); height: var(--toque-min); border: 1px solid var(--borde); border-radius: 50%; background: var(--fondo); color: var(--texto); }
  .accion svg { width: 22px; height: 22px; }
  .cuerpo-nota { grid-area: cuerpo; margin: 6px 0 0; font-size: 13px; color: var(--texto-suave); }
  .cuerpo-nota.aviso { color: var(--error); font-weight: 600; }
  .primario { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: var(--toque); border: none; border-radius: var(--radio); background: var(--primario); color: var(--primario-texto); font-size: 18px; font-weight: 700; }
  .primario[aria-disabled="true"] { background: #a8c5cb; color: #fff; }
  .primario small { font-size: 13px; font-weight: 500; }
  .ayuda-bajo-boton { margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--error); text-align: center; }

  /* Teclado simulado de iOS, para mostrar cómo tapa la tarjeta cuando hay autofocus. */
  .teclado { flex: none; height: 291px; margin: auto -20px -40px; background: #d3d5db; border-top: 1px solid #b9bbc2; }
  .teclado::before { content: "⌨︎ teclado del sistema"; display: block; text-align: center; padding-top: 130px; color: #6f7178; font-size: 13px; }

  /* Hoja "Dónde es": lista de sugerencias con contexto y cercanía. */
  .hoja { position: absolute; inset: auto 0 0 0; height: 78%; background: var(--fondo); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.16); padding: 14px var(--gutter) 24px; overflow-y: auto; }
  .asa { width: 36px; height: 4px; border-radius: 2px; background: var(--borde); margin: 0 auto 12px; }
  .hoja h3 { font-size: 19px; font-weight: 700; font-variation-settings: var(--ancho-titulo); margin-bottom: 12px; }
  .lista { list-style: none; display: grid; gap: 6px; margin-bottom: 8px; }
  .renglon { display: grid; grid-template-columns: 24px 1fr; grid-template-areas: "icono nombre" "icono direccion"; column-gap: 12px; align-items: center; width: 100%; min-height: 56px; padding: 8px 10px; border: none; border-radius: var(--radio); background: none; text-align: left; }
  .renglon:active, .renglon.activo { background: var(--fondo-suave); }
  .renglon > svg { grid-area: icono; color: var(--texto-suave); }
  .renglon > b { grid-area: nombre; font-size: 16px; font-weight: 600; }
  .renglon > small { grid-area: direccion; color: var(--texto-suave); font-size: 13px; }
  .renglon > small > em { font-style: normal; color: var(--primario); font-weight: 600; }
  .campo-buscar { position: relative; display: grid; margin-bottom: 12px; }
  .campo-buscar > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--texto-suave); }
  .campo-buscar > input { min-height: var(--toque); padding: 0 14px 0 44px; border: 1px solid var(--borde); border-radius: var(--radio); background: var(--fondo); font-size: 17px; }

  @media (max-width: 860px) { .telefono { height: auto; min-height: 700px; } .pantalla { height: auto; max-height: 680px; } }
</style>
</head>
<body>

<div class="estudio">
  <p class="rotulo">
    <span>
      <strong>Lugar y dirección en el alta de evento</strong>
      Propuesta para OL-100 (A7), sobre L2, L3 y L37 (founder, 2026-09-21). Datos de ejemplo, no reales. Ver <em>docs/rediseno/26-alta-evento-lugar.md</em> para el detalle de cada estado y las preguntas.
    </span>
  </p>

  <!-- ESTADO 1a: HOY, con autofocus -->
  <figure class="par">
    <div class="telefono">
      <div class="estado-ios" aria-hidden="true"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <main class="pantalla con-teclado">
        <div class="barra"><span class="logotipo">SMSNSTRS</span><span class="cerrar-barra">✕</span></div>
        <h1 style="margin-bottom:6px">Publicar un evento</h1>
        <button type="button" class="cartel" style="margin-bottom:12px">
          <span class="marco"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
          <b>Sube el cartel</b>
          <small>Leemos el nombre, la fecha, el lugar y el precio.</small>
        </button>
        <div class="campo">
          <input type="text" placeholder="Nombre del evento" aria-label="Nombre del evento" style="outline: 2px solid var(--primario)">
        </div>
        <div class="teclado" aria-hidden="true"></div>
      </main>
    </div>
    <figcaption><b>1a · Hoy, en producción</b>El campo del nombre trae <code>autoFocus</code>: el teclado sale solo al abrir y empuja la tarjeta del cartel fuera de la vista. No fue un toque de la persona (L2, confirmado en <code>FormularioEvento.tsx:525</code>).</figcaption>
  </figure>

  <!-- ESTADO 1b: PROPUESTA, sin autofocus -->
  <figure class="par">
    <div class="telefono">
      <div class="estado-ios" aria-hidden="true"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <main class="pantalla">
        <div class="barra"><span class="logotipo">SMSNSTRS</span><span class="cerrar-barra">✕</span></div>
        <h1 style="margin-bottom:6px">Publicar un evento</h1>
        <button type="button" class="cartel" style="margin-bottom:12px">
          <span class="marco"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
          <b>Sube el cartel</b>
          <small>Leemos el nombre, la fecha, el lugar y el precio.</small>
        </button>
        <div class="campo">
          <input type="text" placeholder="Nombre del evento" aria-label="Nombre del evento">
        </div>
        <ul class="renglones">
          <li class="resuelto pendiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="11" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span class="clave">Dónde</span><span class="valor falta">Falta</span><button type="button" class="accion"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></li>
        </ul>
        <button type="button" class="primario" aria-disabled="true">Publicar evento</button>
      </main>
    </div>
    <figcaption><b>1b · Propuesta: sin autofocus</b>Nadie enfoca el nombre al abrir. La tarjeta del cartel, el campo y el primer renglón se ven completos, sin teclado. La persona toca cuando quiere escribir.</figcaption>
  </figure>

  <!-- ESTADO 2: lugar encontrado en el directorio -->
  <figure class="par">
    <div class="telefono">
      <div class="estado-ios" aria-hidden="true"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <main class="pantalla">
        <div class="barra"><span class="logotipo">SMSNSTRS</span><span class="cerrar-barra">✕</span></div>
        <h1>Publicar un evento</h1>
        <div class="cartel leido">
          <img class="miniatura" alt="" src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
          <b>Leí el cartel</b>
          <small>Revisa que todo esté bien y publica.</small>
        </div>
        <div class="campo">
          <input type="text" value="Noche de son jarocho" aria-label="Nombre del evento">
        </div>
        <ul class="renglones">
          <li class="resuelto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="11" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span class="clave">Dónde</span><span class="valor">Teatro de la Paz</span><button type="button" class="cambiar">Cambiar</button></li>
        </ul>
        <button type="button" class="primario">Publicar evento</button>
      </main>
    </div>
    <figcaption><b>2 · Lugar encontrado en el directorio</b>El cartel trajo un lugar que ya existe en el directorio (coincide por nombre): Dónde queda resuelto directo, sin pasar por confirmar dirección. Como hoy.</figcaption>
  </figure>

  <!-- ESTADO 3: dirección leída, sin punto confirmado -->
  <figure class="par">
    <div class="telefono">
      <div class="estado-ios" aria-hidden="true"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <main class="pantalla">
        <div class="barra"><span class="logotipo">SMSNSTRS</span><span class="cerrar-barra">✕</span></div>
        <h1>Publicar un evento</h1>
        <div class="cartel leido">
          <img class="miniatura" alt="" src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
          <b>Leí el cartel</b>
          <small>Revisa que todo esté bien y publica.</small>
        </div>
        <div class="campo">
          <input type="text" value="Noche de son jarocho" aria-label="Nombre del evento">
        </div>
        <ul class="renglones">
          <li class="resuelto confirmar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="11" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <span class="clave">Dónde</span>
            <span class="valor">Calle Guadalupe 210, Barrio de San Miguel</span>
            <button type="button" class="cambiar">Confirmar</button>
            <p class="cuerpo-nota">Confirma la ubicación en el mapa.</p>
          </li>
        </ul>
        <button type="button" class="primario" aria-disabled="true">Publicar evento</button>
      </main>
    </div>
    <figcaption><b>3 · Dirección leída, sin punto confirmado</b>El cartel trajo un nombre y una dirección, pero el pin no está puesto en el mapa. El valor muestra lo leído (no "Falta") y la acción dice "Confirmar"; la ayuda va debajo del renglón, no dentro del botón de publicar.</figcaption>
  </figure>

  <!-- ESTADO 4: sugerencias con contexto y cercanía -->
  <figure class="par">
    <div class="telefono">
      <div class="estado-ios" aria-hidden="true"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <main class="pantalla" style="position:relative">
        <div class="barra"><span class="logotipo">SMSNSTRS</span><span class="cerrar-barra">✕</span></div>
        <h1>Publicar un evento</h1>
        <ul class="renglones">
          <li class="resuelto pendiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="11" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span class="clave">Dónde</span><span class="valor falta">Falta</span><button type="button" class="accion"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></li>
        </ul>
        <div class="hoja">
          <div class="asa"></div>
          <h3>Dónde es</h3>
          <label class="campo-buscar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input type="text" value="soledad" aria-label="Buscar el lugar">
          </label>
          <ul class="lista" role="listbox" aria-label="Lugares y direcciones encontrados">
            <li><button type="button" role="option" class="renglon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="11" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><b>Calle Soledad de Graciano Sánchez</b><small><em>a 300 m</em> · San Luis Potosí, colonia Centro</small></button></li>
            <li><button type="button" role="option" class="renglon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="11" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><b>Municipio de Soledad de Graciano Sánchez</b><small><em>a 6.4 km</em> · fuera de San Luis Potosí</small></button></li>
          </ul>
        </div>
      </main>
    </div>
    <figcaption><b>4 · Sugerencias con contexto y cercanía</b>Cada resultado dice a qué distancia está y en qué colonia o municipio cae, con lo que ya trae Mapbox. Distingue la calle (a 300 m, dentro de la ciudad) del municipio del mismo nombre (a 6.4 km, fuera).</figcaption>
  </figure>

  <!-- ESTADO 5: aviso al publicar sin ubicación -->
  <figure class="par">
    <div class="telefono">
      <div class="estado-ios" aria-hidden="true"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <main class="pantalla">
        <div class="barra"><span class="logotipo">SMSNSTRS</span><span class="cerrar-barra">✕</span></div>
        <h1>Publicar un evento</h1>
        <div class="campo">
          <input type="text" value="Noche de son jarocho" aria-label="Nombre del evento">
        </div>
        <ul class="renglones">
          <li class="resuelto pendiente">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="11" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <span class="clave">Dónde</span>
            <span class="valor falta">Falta</span>
            <button type="button" class="accion"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
            <p class="cuerpo-nota aviso" role="alert">Falta ubicación.</p>
          </li>
        </ul>
        <button type="button" class="primario" aria-disabled="true">Publicar evento</button>
      </main>
    </div>
    <figcaption><b>5 · Intento de publicar sin ubicación</b>El botón "Publicar evento" ya no lleva el texto pequeño adentro. La ayuda vive debajo del renglón que falta ("Falta ubicación."), como pidió el founder: "el estándar es... debajo del campo faltante como help text".</figcaption>
  </figure>

  <!-- ESTADO 6: dirección a medias, caso con nombre "Galeana #423, S.L.P." -->
  <figure class="par">
