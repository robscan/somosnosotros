<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Publicar por pasos</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
/* Prototipo OL-286 (bitácora 314). Una columna de teléfono con la app simulada; arriba, la tira del prototipo para elegir el caso.
   Tema claro único, como la app. Medidas y colores de src/app/globals.css; piezas de ui/Renglon, ui/Hoja, ui/Ficha, ui/Campo + ui/Limpiar. */
:root {
  color-scheme: light;
  --fondo: #ffffff; --fondo-suave: #f4f4f2; --fondo-contenido: #f6f5f1; --texto: #1a1a1a; --texto-suave: #5c5c5c; --borde: #dcdcd8;
  --primario: #6d34c8; --primario-texto: #ffffff; --primario-suave: #ede6f8; --ok: #1f6f43; --ok-suave: #e4eee8; --error: #b3261e;
  --fondo-miniatura: #e6e6e2; --fondo-mapa: #eef0ec; --asa: #d9d9d9; --tira: #1a1a1a; --tira-campo: #2a2a2a; --tira-borde: #555555;
  --velo-hoja: rgba(0, 0, 0, 0.32); --sombra-panel: 0 -2px 16px rgba(0, 0, 0, 0.1); --sombra-flotante: 0 6px 20px rgba(0, 0, 0, 0.22);
  --espacio-1: 4px; --espacio-2: 8px; --espacio-3: 12px; --espacio-4: 16px; --espacio-5: 20px; --espacio-6: 24px;
  --radio: 8px; --radio-grande: 12px; --radio-hoja: 24px; --radio-pildora: 999px;
  --toque: 48px; --toque-min: 44px; --boton-icono: 48px; --boton-icono-grande: 56px; --alto-barra: 56px; --columna: 600px;
  --letra-2xs: 0.75rem; --letra-xs: 0.875rem; --letra-sm: 0.9375rem; --letra-md: 1.0625rem; --letra-lg: 1.125rem; --letra-xl: 1.1875rem;
  --piso: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fondo-contenido); color: var(--texto); font: 400 var(--letra-md)/1.4 "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif; font-variation-settings: "wdth" 80; display: grid; grid-template-rows: auto minmax(0, 1fr); }
button, input, select { font: inherit; font-variation-settings: inherit; color: inherit; }
button { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--primario); outline-offset: 2px; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
h1, h2, h3 { font-variation-settings: "wdth" 75; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 1.625rem; font-weight: 800; }
h2 { font-size: var(--letra-xl); font-weight: 700; }
small, .meta { font-size: var(--letra-sm); color: var(--texto-suave); line-height: 1.35; }
svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
ul { list-style: none; }

/* La tira del prototipo: no es parte de la app. */
.tira { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--espacio-2); align-items: center; padding: var(--espacio-2) var(--espacio-4); background: var(--tira); color: var(--fondo); }
.tira select { min-height: var(--toque-min); min-width: 0; width: 100%; padding: 0 var(--espacio-3); border: 1px solid var(--tira-borde); border-radius: var(--radio); background: var(--tira-campo); color: var(--fondo); font-size: var(--letra-sm); }
.tira label { display: flex; align-items: center; gap: 6px; min-height: var(--toque-min); font-size: var(--letra-xs); white-space: nowrap; }
.tira input { width: 20px; height: 20px; accent-color: var(--primario); }
.tira button { min-height: var(--toque-min); padding: 0 var(--espacio-2); font-size: var(--letra-xs); font-weight: 700; text-decoration: underline; }

/* La app: una columna con su barra; el cuerpo desplaza por dentro. */
.app { position: relative; width: 100%; max-width: var(--columna); margin-inline: auto; background: var(--fondo); display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.barra { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: var(--alto-barra); padding: 0 var(--espacio-5); border-bottom: 1px solid var(--borde); }
.barra img { height: 26px; width: auto; }
.atras { justify-self: start; display: inline-flex; align-items: center; gap: 2px; min-height: var(--toque-min); padding: 0 var(--espacio-4) 0 var(--espacio-2); border: 1px solid var(--borde); border-radius: var(--radio-pildora); font-size: var(--letra-sm); font-weight: 700; }
.atras svg { width: 18px; height: 18px; color: var(--texto-suave); stroke-width: 2; }
.pagina { overflow-y: auto; padding: var(--espacio-6) var(--espacio-5) calc(var(--espacio-6) + var(--piso)); display: grid; align-content: start; gap: var(--espacio-4); }
.pagina.contenido { background: var(--fondo-contenido); }

/* ui/Boton */
.btn { display: flex; width: 100%; min-height: var(--toque); align-items: center; justify-content: center; gap: var(--espacio-2); padding: var(--espacio-2) var(--espacio-4); border-radius: var(--radio); background: var(--primario); color: var(--primario-texto); font-size: var(--letra-lg); font-weight: 700; line-height: 1.2; text-align: center; }
.btn.sec { background: var(--fondo); color: var(--texto); box-shadow: inset 0 0 0 1px var(--borde); }
.btn:disabled { background: var(--fondo-suave); color: var(--texto-suave); cursor: default; }
.quieto { display: block; width: 100%; min-height: var(--toque-min); color: var(--texto-suave); font-size: var(--letra-sm); font-weight: 700; text-decoration: underline; }

/* ui/Campo con icono + ui/Limpiar */
.campo { position: relative; display: grid; }
.campo > svg { position: absolute; left: 14px; top: 12px; color: var(--texto-suave); pointer-events: none; }
.campo input { width: 100%; min-height: var(--toque); padding: 0 44px; border: 1px solid var(--borde); border-radius: var(--radio); background: var(--fondo); font-size: var(--letra-md); }
.campo input:focus { border-color: var(--texto); outline: none; }
.limpiar { position: absolute; right: 0; top: 0; width: var(--toque); height: var(--toque); display: grid; place-items: center; color: var(--texto-suave); }
.limpiar svg { width: 18px; height: 18px; stroke-width: 2; }
.campo input:placeholder-shown ~ .limpiar { display: none; }

/* ui/Renglon, piel "resuelto": icono | clave / valor | acción. Pendiente = borde punteado. */
.renglon { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; column-gap: var(--espacio-3); align-items: center; width: 100%; min-height: 60px; padding: 10px 14px; border: 1px solid var(--borde); border-radius: var(--radio); background: var(--fondo); text-align: left; }
.renglon > svg { color: var(--texto-suave); }
.renglon small { display: block; font-size: var(--letra-xs); text-transform: uppercase; letter-spacing: 0.04em; }
.renglon b { display: block; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.renglon .accion { color: var(--primario); font-size: var(--letra-sm); font-weight: 700; }
.renglon.pendiente { border-style: dashed; border-color: var(--texto-suave); }
.renglon.elegible { min-height: 68px; }
.renglon.elegible b + span { display: block; font-size: var(--letra-sm); color: var(--texto-suave); line-height: 1.3; }
.grupo { display: grid; gap: var(--espacio-2); }
.chips { display: flex; flex-wrap: wrap; gap: var(--espacio-2); }
.chip { min-height: 36px; padding: 0 var(--espacio-4); border: 1px solid var(--borde); border-radius: var(--radio-pildora); background: var(--fondo); font-size: var(--letra-sm); font-weight: 600; }

/* Publicado + la sugerencia: la ficha de lo que se crearía, en punteado mientras no existe. */
.hecho { display: flex; align-items: center; gap: var(--espacio-2); color: var(--ok); font-size: var(--letra-sm); font-weight: 700; }
.hecho svg { width: 20px; height: 20px; stroke-width: 2.2; }
.tarjeta { display: grid; grid-template-columns: 56px minmax(0, 1fr); column-gap: var(--espacio-3); align-items: center; padding: var(--espacio-3); border: 1px solid var(--borde); border-radius: var(--radio-grande); background: var(--fondo); }
.tarjeta .fecha { display: grid; place-items: center; align-content: center; width: 56px; height: 56px; border-radius: var(--radio); background: var(--fondo-suave); font-weight: 800; line-height: 1; font-variation-settings: "wdth" 75; }
.tarjeta .fecha span { font-size: var(--letra-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-suave); margin-top: 3px; }
.tarjeta b { display: block; font-weight: 700; line-height: 1.2; }
.sugerencia { display: grid; gap: var(--espacio-3); padding: var(--espacio-4); border: 1.5px dashed var(--primario); border-radius: var(--radio-grande); background: var(--fondo); }
.sugerencia.lista { border: 1px solid var(--borde); }
.sello { justify-self: start; display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 10px; border-radius: var(--radio-pildora); background: var(--primario-suave); color: var(--primario); font-size: var(--letra-2xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.sello.ok { background: var(--ok-suave); color: var(--ok); }
.sello.gris { background: var(--fondo-suave); color: var(--texto-suave); }
.sello svg { width: 14px; height: 14px; stroke-width: 2.4; }
.sugerencia h2 { font-size: 1.375rem; font-weight: 800; }
.datos { display: grid; gap: 6px; }
.datos li { display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: var(--espacio-2); align-items: start; font-size: var(--letra-sm); line-height: 1.35; }
.datos svg { width: 20px; height: 20px; color: var(--texto-suave); }
.datos .falta { color: var(--texto-suave); }
/* Los actos de un festival: unidos por una línea (conectividad). */
.actos { display: grid; }
.actos li { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: var(--espacio-3); padding-bottom: var(--espacio-3); }
.actos li::before { content: ""; width: 10px; height: 10px; margin: 6px 5px 0; border-radius: 50%; background: var(--primario); }
.actos li:not(:last-child)::after { content: ""; position: absolute; left: 9px; top: 18px; bottom: -4px; width: 2px; background: var(--primario); opacity: 0.35; }
.actos b { display: block; line-height: 1.2; }
.actos li.nuevo::before { background: var(--fondo); box-shadow: inset 0 0 0 2px var(--primario); }

/* Ficha de evento (ui/Ficha): portada, acciones redondas, tarjeta Dónde. */
.portada { display: grid; align-content: end; aspect-ratio: 3 / 2; max-width: none; margin: calc(var(--espacio-6) * -1) calc(var(--espacio-5) * -1) 0; padding: var(--espacio-5); background: linear-gradient(to top, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.2) 60%), var(--tono); color: var(--primario-texto); }
.portada small { color: var(--primario-texto); opacity: 0.85; }
.acciones { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--espacio-2); }
.accion-ficha { display: grid; justify-items: center; gap: 6px; font-size: var(--letra-xs); font-weight: 600; text-align: center; line-height: 1.2; }
.accion-ficha .circulo { display: grid; place-items: center; width: var(--boton-icono-grande); height: var(--boton-icono-grande); border-radius: 50%; box-shadow: inset 0 0 0 1px var(--borde); background: var(--fondo); }
.accion-ficha.principal .circulo { background: var(--primario); color: var(--primario-texto); box-shadow: none; }
.caja { display: grid; gap: var(--espacio-3); padding: var(--espacio-4); border-radius: var(--radio-grande); background: var(--fondo); border: 1px solid var(--borde); }
.mapa-ficha { display: block; width: 100%; aspect-ratio: 16 / 7; border-radius: var(--radio); overflow: hidden; background: var(--fondo-mapa); }
.mapa-ficha svg, .lienzo svg { width: 100%; height: 100%; stroke: none; }
.dato { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; column-gap: var(--espacio-3); align-items: center; width: 100%; min-height: var(--toque-min); text-align: left; }
.dato > svg { width: 20px; height: 20px; color: var(--texto-suave); }
.dato > svg:last-child { width: 18px; height: 18px; stroke-width: 2; }
.dato b { display: block; font-weight: 600; line-height: 1.25; }

/* El mapa de la plataforma con la hoja media encima. */
.vista-mapa { position: absolute; inset: 0; z-index: 5; background: var(--fondo-mapa); }
.lienzo { position: absolute; inset: 0 0 38% 0; }
.flotante { position: absolute; top: var(--espacio-3); left: var(--espacio-4); z-index: 2; display: grid; place-items: center; width: var(--boton-icono); height: var(--boton-icono); border-radius: 50%; background: var(--fondo); box-shadow: var(--sombra-flotante); }
.flotante svg { stroke-width: 2; }
.hoja { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: grid; align-content: start; gap: var(--espacio-3); max-height: 78%; min-height: 46%; overflow-y: auto; padding: var(--espacio-3) var(--espacio-5) calc(var(--espacio-5) + var(--piso)); border-radius: var(--radio-hoja) var(--radio-hoja) 0 0; background: var(--fondo); box-shadow: var(--sombra-panel); }
.hoja::before { content: ""; justify-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--asa); }
.cabeza-lugar { display: grid; grid-template-columns: 64px minmax(0, 1fr); column-gap: var(--espacio-3); align-items: center; }
.cabeza-lugar.sin-foto { grid-template-columns: minmax(0, 1fr); row-gap: var(--espacio-2); }
.miniatura { display: grid; place-items: center; width: 64px; height: 64px; border-radius: var(--radio); background: var(--tono); color: var(--primario-texto); font-weight: 800; font-variation-settings: "wdth" 75; }
.cabeza-lugar h2 { font-size: 1.375rem; font-weight: 800; }
.velo { position: absolute; inset: 0; z-index: 8; background: var(--velo-hoja); }
.velo .hoja { min-height: 0; max-height: calc(100% - 48px); }
.aviso { position: absolute; left: var(--espacio-4); right: var(--espacio-4); bottom: calc(var(--espacio-4) + var(--piso)); z-index: 9; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--espacio-3); min-height: var(--toque); padding: var(--espacio-2) var(--espacio-4); border-radius: var(--radio); background: var(--texto); color: var(--fondo); font-size: var(--letra-sm); box-shadow: var(--sombra-flotante); }
.aviso button { min-height: var(--toque-min); font-weight: 700; text-decoration: underline; }

/* ¿Dónde es?: buscar, y la lista flota bajo el campo. */
.lista-flotante { display: grid; border: 1px solid var(--borde); border-radius: var(--radio); background: var(--fondo); box-shadow: var(--sombra-flotante); overflow: hidden; }
.lista-flotante button { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; column-gap: var(--espacio-3); align-items: center; min-height: 56px; padding: var(--espacio-2) var(--espacio-3); text-align: left; }
.lista-flotante button + button { border-top: 1px solid var(--borde); }
.lista-flotante svg { width: 20px; height: 20px; color: var(--texto-suave); }
.lista-flotante b { display: block; font-weight: 600; line-height: 1.2; }
.confirma { display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: var(--espacio-3); align-items: start; padding: var(--espacio-3); border-radius: var(--radio); background: var(--fondo-suave); font-size: var(--letra-sm); line-height: 1.35; }
.confirma svg { width: 20px; height: 20px; color: var(--ok); stroke-width: 2.2; }

/* Calendario (ui/Calendario): círculos de 44, 7 columnas. */
.mes { display: flex; align-items: center; justify-content: space-between; }
.mes button { display: grid; place-items: center; width: var(--toque-min); height: var(--toque-min); border-radius: 50%; }
.mes button:disabled { opacity: 0.35; }
.mes button svg { width: 18px; height: 18px; stroke-width: 2; }
.semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; text-align: center; }
.semana > span { font-size: var(--letra-xs); color: var(--texto-suave); padding: var(--espacio-1) 0; }
.dia { justify-self: center; width: 100%; max-width: var(--toque-min); aspect-ratio: 1; min-width: 0; border-radius: 50%; font-size: var(--letra-sm); }
.dia:disabled { color: var(--texto-suave); opacity: 0.65; cursor: default; }
.dia.extremo { background: var(--primario); color: var(--primario-texto); opacity: 1; }
.dia.dentro { justify-self: stretch; align-self: stretch; max-width: none; aspect-ratio: auto; height: auto; border-radius: 0; background: var(--primario-suave); }

.notas { padding-top: var(--espacio-2); border-top: 1px dashed var(--borde); font-size: var(--letra-sm); color: var(--texto-suave); }
.notas summary { min-height: var(--toque-min); display: flex; align-items: center; font-weight: 700; cursor: pointer; }
.notas li { margin: 0 0 var(--espacio-2) var(--espacio-5); list-style: disc; }
@media (min-width: 640px) { body { background: var(--fondo-suave); } .app { margin-block: var(--espacio-5); border: 1px solid var(--borde); border-radius: var(--radio-grande); max-width: 420px; } }
@media (prefers-reduced-motion: no-preference) { .hoja { animation: sube 0.22s ease-out; } @keyframes sube { from { transform: translateY(24px); opacity: 0.6; } } }
/* ---- Propio de este prototipo (OL-295, bitácora 323): un paso por pantalla, con el botón pegado abajo. ---- */
.tira { grid-template-columns: minmax(0, 1fr); }
.tira output { font-size: var(--letra-xs); font-variant-numeric: tabular-nums; }
.app { grid-template-rows: auto auto minmax(0, 1fr) auto; }
.barra { grid-template-columns: auto 1fr auto; column-gap: var(--espacio-3); }
.barra b { font-size: var(--letra-md); font-weight: 700; text-align: center; }
.barra .hueco { width: var(--toque-min); }
.redondo { display: grid; place-items: center; width: var(--toque-min); height: var(--toque-min); border-radius: 50%; }
.redondo svg { stroke-width: 2; }
.avance { height: 3px; background: var(--fondo-suave); }
.avance i { display: block; height: 100%; background: var(--primario); transition: width 0.2s ease-out; }
.pagina { gap: var(--espacio-5); padding-top: var(--espacio-7, 32px); }
.pie { display: grid; gap: var(--espacio-2); padding: var(--espacio-3) var(--espacio-5) calc(var(--espacio-4) + var(--piso)); border-top: 1px solid var(--borde); background: var(--fondo); }
.pie:empty { display: none; }
.pregunta { font-size: 1.875rem; font-weight: 800; }
.ayuda { margin-top: calc(var(--espacio-3) * -1); }
.cartel-mini { display: grid; align-content: end; width: 96px; aspect-ratio: 4 / 5; padding: var(--espacio-2); border-radius: var(--radio); background: linear-gradient(to top, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.1)), var(--tono); color: var(--primario-texto); font-size: 0.625rem; font-weight: 800; line-height: 1.1; font-variation-settings: "wdth" 75; }
.leyendo { display: grid; justify-items: center; gap: var(--espacio-4); padding-top: var(--espacio-6); }
.leyendo .cartel-mini { width: 168px; font-size: 1rem; padding: var(--espacio-3); }
/* Revisar: la ficha como se verá, y cada dato es un renglón que se toca para cambiarlo. */
.cabeza-revisar { display: grid; grid-template-columns: 96px minmax(0, 1fr); column-gap: var(--espacio-4); align-items: end; }
.cabeza-revisar.sin { grid-template-columns: minmax(0, 1fr); }
.cabeza-revisar h1 { font-size: 1.5rem; }
.leido { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-size: var(--letra-xs); font-weight: 700; }
.leido svg { width: 16px; height: 16px; stroke-width: 2.4; }
button.renglon { cursor: pointer; }
/* Opciones grandes: una decisión por pantalla; elegir avanza solo. */
.opciones { display: grid; gap: var(--espacio-3); }
.opcion { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; column-gap: var(--espacio-3); align-items: center; min-height: 64px; padding: var(--espacio-3) var(--espacio-4); border: 1px solid var(--borde); border-radius: var(--radio-grande); background: var(--fondo); text-align: left; font-size: var(--letra-lg); font-weight: 700; }
.opcion > svg:first-child { color: var(--primario); }
.opcion > svg:last-child { width: 18px; height: 18px; color: var(--texto-suave); stroke-width: 2; }
.opcion small { display: block; font-weight: 400; }
.fila-chips { display: flex; flex-wrap: wrap; gap: var(--espacio-2); }
.fila-chips .chip { min-height: var(--toque-min); font-size: var(--letra-md); }
.chip[aria-pressed="true"] { background: var(--primario); border-color: var(--primario); color: var(--primario-texto); }
/* Confirmar en el mapa y elegir el diseño del cartel. */
.mapa-paso { aspect-ratio: 4 / 3; max-height: 38vh; border-radius: var(--radio-grande); overflow: hidden; background: var(--fondo-mapa); }
.mapa-paso svg { width: 100%; height: 100%; stroke: none; }
.disenos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--espacio-3); }

    return {
      titulo: '', final: true,
      cuerpo: `<div class="final"><span class="sello-ok">${ic('ok')}</span><h1>${caso === 'programa' ? `${n} eventos publicados` : caso === 'taller' ? 'Taller publicado' : 'Evento publicado'}</h1><p class="meta">${caso === 'programa' ? 'Ya están en la agenda, juntos en Festival Umbral 2026.' : 'Ya está en la agenda. Así lo ve la gente:'}</p></div>
        ${caso === 'programa' ? `<section class="sugerencia lista"><span class="sello ok">${ic('ok')}Festival</span><h2>Festival Umbral 2026</h2><ul class="actos">${PROGRAMA.filter((_, i) => e.elegidos[i]).map(([t, x]) => `<li><div><b>${t}</b><small>${x}</small></div></li>`).join('')}</ul></section>` : `<div class="tarjeta"><div class="fecha">${(d.cuando || '').match(/(\d+) de/)?.[1] || 'sáb'}<span>${/ de /.test(d.cuando || '') ? 'nov' : 'próx'}</span></div><div><b>${d.nombre}</b><small>${[d.cuando, d.donde].filter(Boolean).join(' · ')}</small></div></div>`}
        ${sug}`,
      pie: `<button class="btn ${sug && e.sug === 'abierta' ? 'sec' : ''}" data-a="compartir">Compartir</button><button class="quieto" data-a="otro">Publicar otro</button>`,
      notas: ['El final es el momento que se recuerda: confirmación grande, el evento como quedó y una sola invitación a seguir.', 'La sugerencia en punteado es la ya aceptada (exposición, festival). Nunca hay dos a la vez.', 'Compara arriba: toques y escrituras de este recorrido contra los de la pantalla de hoy.'],
    };
  },
};

function pintar(foco) {
  const p = paso(), v = VISTAS[p](), total = pasos().length - 1;
  $('#barra').innerHTML = v.final ? '<span class="hueco"></span><b></b><span class="hueco"></span>'
    : `<button class="redondo" data-a="${e.i === 0 && !e.editar ? 'cerrar' : 'atras'}" aria-label="${e.i === 0 && !e.editar ? 'Cerrar' : 'Atrás'}">${ic(e.i === 0 && !e.editar ? 'cerrar' : 'atras')}</button><b>${v.titulo}</b><span class="hueco"></span>`;
  $('#avance').style.width = `${Math.round((e.i / total) * 100)}%`;
  const pagina = $('#pagina');
  pagina.className = `pagina ${e.dir}`;
  pagina.innerHTML = (v.pregunta ? `<h1 class="pregunta">${v.pregunta}</h1>` : '') + v.cuerpo + (v.notas.length ? notas(v.notas) : '');
  pagina.scrollTop = 0;
  $('#pie').innerHTML = v.pie;
  $('#cuenta').textContent = `Aquí: ${e.toques} toques y ${e.escritos.size} escrituras · Hoy: ${HOY[caso]}`;
  const c = foco ? $(foco) : pagina.querySelector('input');
  if (c && (foco || e.dir !== 'fija')) { c.focus({ preventScroll: true }); c.setSelectionRange?.(c.value.length, c.value.length); }
  if (p === 'leyendo') { clearTimeout(pintar.t); pintar.t = setTimeout(() => ir(e.i + 1), 1100); }
}
function reiniciar() { clearTimeout(pintar.t); caso = $('#caso').value; e = nuevo(); try { history.replaceState(null, '', '#' + caso); } catch { /* sin historial, sigue igual */ } pintar(); }

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-a],[data-dia],[data-hora],[data-sitio],[data-cuanto],[data-elegir],[data-editar],[data-uso],[data-diseno],[data-inicio]');
  if (!t || t.closest('.tira')) return;
  e.toques++; e.dir = 'entra';
  const { a, dia, hora, sitio, cuanto, elegir, editar, uso, diseno, inicio } = t.dataset;
  if (dia) { e.dia = dia; e.dir = 'fija'; return pintar(); }
  if (hora) { e.d.cuando = `${e.dia} · ${hora === 'Otra hora' ? '21:00' : hora}`; return sigue(); }
  if (sitio) { const n = Number(sitio); e.d.donde = n === 2 ? 'Jardín de San Juan de Dios' : SITIOS[n][0]; e.q = ''; e.fuera = n === 2; e.mapa = n === 2; return trasDonde(); }
  if (uso) { e.usoSitio = uso; return e.editar ? (e.editar = null, e.dir = 'vuelve', pintar()) : sigue(); }
  if (diseno) { e.flyer = Number(diseno); e.editar = null; e.dir = 'vuelve'; return pintar(); }
  if (inicio) { if (inicio === 'subir') { if (caso === 'sin') { caso = 'legible'; $('#caso').value = caso; const tq = e.toques; e = nuevo(); e.toques = tq; } return ir(1); } caso = 'sin'; $('#caso').value = caso; const tq = e.toques; e = nuevo(); e.toques = tq; e.quiereFlyer = inicio === 'flyer'; return ir(1); }
  if (cuanto) { if (cuanto === 'Tiene precio') { e.precioAbierto = true; return pintar(); } e.d.cuanto = cuanto; return sigue(); }
  if (elegir) { const i = Number(elegir); e.elegidos[i] = !e.elegidos[i]; e.dir = 'fija'; return pintar(); }
  if (editar) { if (editar === 'quien') { e.toques--; return; } e.editar = editar; e.dia = null; e.precioAbierto = false; return pintar(); }
  if (a === 'sigue') return sigue();
  if (a === 'aqui') { e.d.donde = 'Jardín de San Francisco'; e.fuera = false; e.mapa = true; return trasDonde(); }
  if (a === 'mapa-ok') { if (e.editar) { e.editar = e.fuera ? 'uso' : null; e.dir = e.fuera ? 'entra' : 'vuelve'; return pintar(); } return sigue(); }
  if (a === 'precio-listo') { e.d.cuanto = `$${e.precio.trim()}`; e.precioAbierto = false; return sigue(); }
  if (a === 'limpiar') { e.toques--; const id = t.dataset.de; if (id === 'q') e.q = ''; else if (id === 'precio') e.precio = ''; else e.d.nombre = ''; e.dir = 'fija'; return pintar('#' + id); }
  if (a === 'atras') { if (e.editar) { e.editar = null; e.dir = 'vuelve'; return pintar(); } const ps = pasos(); let n = e.i - 1; if (ps[n] === 'leyendo') n--; return ir(n, 'vuelve'); }
  if (a === 'cerrar' || a === 'otro') { e.toques = 0; return reiniciar(); }
  if (a === 'sug') { e.sug = 'hecha'; e.dir = 'fija'; return pintar(); }
  if (a === 'sug-no') { e.sug = 'no'; e.dir = 'fija'; return pintar(); }
  if (a === 'flyer') { e.editar = 'flyer'; return pintar(); }
  if (a === 'sin-flyer') { e.quiereFlyer = false; e.flyer = null; e.dir = 'fija'; return pintar(); }
  e.dir = 'fija'; if (a === 'mas' || a === 'compartir') return pintar();
});
document.addEventListener('input', (ev) => {
  const id = ev.target.id; if (!['nombre', 'q', 'precio'].includes(id)) return;
  e.escritos.add(id + e.i);
  if (id === 'nombre') e.d.nombre = ev.target.value; else if (id === 'q') e.q = ev.target.value; else e.precio = ev.target.value.replace(/\D/g, '');
  e.dir = 'fija'; pintar('#' + id);
});
$('#caso').addEventListener('change', reiniciar);
const inicial = location.hash.slice(1); if ([...$('#caso').options].some((o) => o.value === inicial)) $('#caso').value = inicial;
reiniciar();
</script>
</body>
</html>
