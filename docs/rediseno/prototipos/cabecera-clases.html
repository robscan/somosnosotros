<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabecera por clase</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
/* Prototipo OL-351 (bitácora 380): la ficha de exposición, taller y festival distinta de la de un evento. Dos variantes para elegir con la
   tira: A, la cabecera oscura (portada a sangre, título encima y los números de la clase sobre la banda; el cuerpo claro de hoy) y B, la
   ficha oscura completa (la de hoy con todos los tokens en oscuro), más «Hoy» para comparar. Mismo armazón que exposicion-festival-taller.html
   (tokens de src/app/globals.css, Bricolage de Google Fonts, la tira oscura arriba). Las portadas son dibujos de relleno. */
:root {
  color-scheme: light;
  --fondo: #ffffff; --fondo-suave: #f4f4f2; --fondo-contenido: #f6f5f1; --fondo-miniatura: #e6e6e2; --fondo-mapa: #eef0ec;
  --texto: #1a1a1a; --texto-suave: #5c5c5c; --borde: #dcdcd8;
  --primario: #6d34c8; --primario-texto: #ffffff; --ok: #1f6f43;
  --vidrio: rgba(255, 255, 255, 0.92);
  --velo-titulo: linear-gradient(to top, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.44) 55%, rgba(0, 0, 0, 0));
  --velo-barra: rgba(0, 0, 0, 0.6);
  --sombra: 0 2px 12px rgba(0, 0, 0, 0.08); --sombra-flotante: 0 6px 20px rgba(0, 0, 0, 0.22);
  --tira: #1a1a1a; --tira-campo: #2a2a2a; --tira-borde: #555555;
  --espacio-1: 4px; --espacio-2: 8px; --espacio-3: 12px; --espacio-4: 16px; --espacio-5: 20px; --espacio-6: 24px; --espacio-7: 32px; --espacio-8: 40px;
  --radio-chico: 4px; --radio: 8px; --radio-grande: 12px; --radio-pildora: 999px;
  --toque: 48px; --toque-min: 44px; --boton-icono: 48px; --boton-icono-grande: 56px; --columna: 600px; --gutter: 20px;
  --letra-2xs: 0.75rem; --letra-xs: 0.875rem; --letra-sm: 0.9375rem; --letra-md: 1.0625rem; --letra-lg: 1.125rem; --letra-xl: 1.1875rem; --letra-2xl: 1.625rem;
  --ancho-titulo: "wdth" 75; --ancho-texto: "wdth" 80;
  --tope: env(safe-area-inset-top, 0px); --piso: env(safe-area-inset-bottom, 0px);
  --z-sobre: 1; --z-pegajoso: 10; --z-flotante: 20;
  --duracion: 180ms;
  /* Lo nuevo de la variante A: la banda oscura y lo que va sobre ella (cuatro tokens). */
  --banda: #141414;
  --sobre-banda: rgba(255, 255, 255, 0.08);
  --sobre-banda-borde: rgba(255, 255, 255, 0.18);
  --sobre-banda-suave: rgba(255, 255, 255, 0.72);
}
/* La variante B: la misma ficha con TODOS los tokens en oscuro. Cada token de color de globals.css necesita su par; el violeta se aclara
   para leerse sobre negro (el #6d34c8 da 2,6:1 sobre #111). */
.app[data-variante="b"] {
  color-scheme: dark;
  --fondo: #1c1c1e; --fondo-suave: #262628; --fondo-contenido: #111111; --fondo-miniatura: #2c2c2e;
  --texto: #f2f2f0; --texto-suave: #a5a5a0; --borde: #333335;
  --primario: #b69cf5; --primario-texto: #160a2e; --ok: #6fcf97;
  --vidrio: rgba(28, 28, 30, 0.92);
  --sombra: 0 0 0 1px #333335; --sombra-flotante: 0 0 0 1px #3a3a3c, 0 6px 20px rgba(0, 0, 0, 0.6);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fondo-contenido); color: var(--texto); font: 400 var(--letra-md)/1.4 "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif; font-variation-settings: var(--ancho-texto); display: grid; grid-template-rows: auto minmax(0, 1fr); }
button { font: inherit; font-variation-settings: inherit; color: inherit; appearance: none; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--primario); outline-offset: 2px; }
h1, h2, h3, p, ul, figure { margin: 0; padding: 0; }
h1, h2 { font-variation-settings: var(--ancho-titulo); line-height: 1.15; text-wrap: balance; }
h2 { font-size: var(--letra-xl); font-weight: 700; }
ul { list-style: none; }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* La tira del prototipo: no es parte de la app. */
.tira { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--espacio-2); padding: var(--espacio-2) var(--espacio-4); background: var(--tira); color: #fff; }
.tira select { min-height: var(--toque-min); width: 100%; min-width: 0; padding: 0 var(--espacio-2); border: 1px solid var(--tira-borde); border-radius: var(--radio); background: var(--tira-campo); color: #fff; font: inherit; font-size: var(--letra-sm); }

/* La app: la ficha desplaza por dentro. */
.app { position: relative; width: 100%; max-width: var(--columna); margin-inline: auto; overflow-y: auto; background: var(--fondo-contenido); color: var(--texto); }
@media (min-width: 640px) { body { background: var(--fondo-suave); } .app { margin-block: var(--espacio-5); border: 1px solid var(--borde); border-radius: var(--radio-grande); max-width: 420px; } }

/* La ficha (ui/Ficha): barra · héroe · cuerpo · flotantes. */
.ficha { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 0 max-content max-content 1fr; grid-template-areas: "barra" "heroe" "cuerpo" "flotantes"; padding-bottom: calc(var(--espacio-4) + var(--piso)); }
.barra { grid-area: barra; align-self: start; position: sticky; top: 0; z-index: var(--z-pegajoso); display: grid; grid-template-columns: var(--boton-icono) minmax(0, 1fr) var(--boton-icono); align-items: center; column-gap: var(--espacio-2); padding: calc(var(--tope) + var(--espacio-2)) var(--gutter) var(--espacio-2); transition: background-color var(--duracion); }
.barra > button { display: grid; place-items: center; width: var(--boton-icono); height: var(--boton-icono); border-radius: 50%; background: #fff; color: #1a1a1a; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08); }
.barra > b { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: center; font-weight: 700; font-variation-settings: var(--ancho-titulo); color: #fff; opacity: 0; transition: opacity var(--duracion); }
.ficha[data-compacta] > .barra { background: linear-gradient(var(--velo-barra), var(--velo-barra)), var(--portada); }
.ficha[data-compacta] > .barra > b { opacity: 1; }
.ficha[data-compacta] > .barra > button { background: none; box-shadow: none; color: #fff; }

/* El héroe de hoy (ui/Heroe): portada 3:2 y, en la misma celda, el título sobre el velo. */
.portada, .titulo { grid-area: heroe; }
.portada { aspect-ratio: 3 / 2; overflow: hidden; background: var(--fondo-miniatura); }
.portada svg { display: block; width: 100%; height: 100%; }
.titulo { align-self: end; z-index: var(--z-sobre); display: grid; justify-items: start; gap: var(--espacio-2); padding: var(--espacio-8) var(--gutter) var(--espacio-4); background: var(--velo-titulo); color: #fff; }
.titulo h1 { font-size: var(--letra-xl); font-weight: 700; }
.etiqueta { padding: 2px var(--espacio-2); border-radius: var(--radio-pildora); background: var(--vidrio); color: var(--primario); font-size: var(--letra-xs); font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; }
.meta { font-size: var(--letra-sm); font-weight: 500; opacity: 0.9; }

/* Variante A: la cabecera oscura. La portada llega a los bordes, el velo baja hasta el color de la banda y la banda sigue debajo con los
   tres números de la clase. Una rejilla: la portada y el título comparten la celda «heroe»; los números van en «numeros». */
.ficha.a { grid-template-rows: 0 max-content max-content max-content 1fr; grid-template-areas: "barra" "heroe" "numeros" "cuerpo" "flotantes"; }
/* La portada llena toda la celda aunque el título crezca (título largo o a 320): debajo del velo nunca asoma el fondo claro. */
.ficha.a .portada { width: 100%; aspect-ratio: 4 / 3; align-self: stretch; background: var(--banda); }
.ficha.a .titulo { padding-top: 96px; padding-bottom: var(--espacio-3); background: linear-gradient(to top, var(--banda), rgba(20, 20, 20, 0.7) 45%, rgba(20, 20, 20, 0)); }
.ficha.a .titulo h1 { font-size: var(--letra-2xl); font-weight: 800; }
.ficha.a .numeros { grid-area: numeros; padding: var(--espacio-1) var(--gutter) var(--espacio-5); background: var(--banda); }
.ficha.a .numeros .kpi { border-color: var(--sobre-banda-borde); background: var(--sobre-banda); color: #fff; }
.ficha.a .numeros .kpi svg, .ficha.a .numeros .kpi small { color: var(--sobre-banda-suave); }

/* El cuerpo de hoy. */
.cuerpo { grid-area: cuerpo; display: grid; grid-auto-rows: max-content; align-content: start; row-gap: var(--espacio-6); padding: var(--espacio-4) var(--gutter) 0; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--espacio-2); }
.kpi { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "icono etiqueta" "valor valor"; align-items: center; align-content: start; gap: var(--espacio-1); padding: 10px; border: 1px solid var(--borde); border-radius: var(--radio); background: var(--fondo); }
.kpi svg { grid-area: icono; width: 16px; height: 16px; color: var(--texto-suave); }
.kpi small { grid-area: etiqueta; min-width: 0; overflow: hidden; color: var(--texto-suave); font-size: var(--letra-2xs); font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; text-overflow: ellipsis; }
.kpi b { grid-area: valor; font-size: 1rem; font-weight: 700; font-variation-settings: var(--ancho-titulo); line-height: 1.15; overflow-wrap: anywhere; text-wrap: balance; }
.linea { margin-top: calc(var(--espacio-3) - var(--espacio-6)); color: var(--texto-suave); font-size: var(--letra-sm); }
.acciones { display: flex; flex-wrap: wrap; gap: var(--espacio-3); margin-top: calc(var(--espacio-5) - var(--espacio-6)); }
.ficha.a .acciones { margin-top: 0; }
.accion { display: grid; justify-items: center; gap: 6px; min-width: var(--boton-icono-grande); font-size: var(--letra-xs); font-weight: 600; }
.accion > span { display: grid; place-items: center; width: var(--boton-icono-grande); height: var(--boton-icono-grande); border-radius: 50%; background: var(--fondo); color: var(--primario); box-shadow: var(--sombra); }
.bloque, .tarjeta { display: grid; gap: var(--espacio-2); }
.bloque > h3 { padding-top: var(--espacio-2); color: var(--texto-suave); font-size: var(--letra-sm); font-weight: 700; }
.tarjeta { padding: var(--espacio-3) var(--espacio-4) var(--espacio-2); border: 1px solid var(--borde); border-radius: var(--radio-grande); background: var(--fondo); }
.nota { color: var(--texto-suave); font-size: var(--letra-sm); }
.texto { color: var(--texto); }

/* ui/Renglon .lista (el programa) y .dato (sesiones, horario, sedes). */
.lista { display: grid; grid-template-columns: 56px minmax(0, 1fr) var(--toque-min); grid-template-areas: "foto titulo accion" "foto hora accion" "foto sitio accion"; column-gap: var(--espacio-3); align-items: center; padding: var(--espacio-3) 0; border-bottom: 1px solid var(--borde); }
.lista .foto { grid-area: foto; width: 56px; height: 56px; border-radius: var(--radio-chico); }
.lista b { grid-area: titulo; font-size: var(--letra-xl); font-weight: 700; font-variation-settings: var(--ancho-titulo); line-height: 1.15; }
.lista .hora { grid-area: hora; display: flex; align-items: center; gap: 6px; color: var(--primario); font-size: var(--letra-sm); font-weight: 600; }
.lista .sitio { grid-area: sitio; display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--texto-suave); font-size: var(--letra-sm); }
.lista .sitio span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.lista .hora svg, .lista .sitio svg { width: 16px; height: 16px; }
.lista .marcar { grid-area: accion; display: grid; place-items: center; width: var(--toque-min); height: var(--toque-min); color: var(--primario); }
.dato { display: grid; grid-template-columns: var(--toque-min) minmax(0, 1fr) auto; grid-template-areas: "icono texto angulo" "icono meta angulo"; align-items: center; column-gap: var(--espacio-1); min-height: var(--toque-min); padding: var(--espacio-2) 0; text-align: left; width: 100%; }
.dato > svg:first-child { grid-area: icono; justify-self: center; width: 20px; height: 20px; color: var(--texto-suave); }
.dato > b { grid-area: texto; font-weight: 700; font-variation-settings: var(--ancho-titulo); font-size: var(--letra-lg); line-height: 1.2; }
.dato > small { grid-area: meta; color: var(--texto-suave); font-size: var(--letra-sm); }
.dato > svg:last-child:not(:first-child) { grid-area: angulo; width: 20px; height: 20px; color: var(--texto-suave); }
.mapa { width: 100%; aspect-ratio: 600 / 250; border-radius: var(--radio); overflow: hidden; background: var(--fondo-mapa); }
.mapa svg { display: block; width: 100%; height: 100%; }

/* Las pastillas flotantes. */
.flotantes { grid-area: flotantes; align-self: end; justify-self: center; position: sticky; bottom: calc(var(--piso) + var(--espacio-4)); z-index: var(--z-flotante); display: flex; gap: var(--espacio-2); margin-top: var(--espacio-6); }
.pastilla { display: inline-flex; align-items: center; gap: var(--espacio-2); min-height: var(--toque); padding: 0 var(--espacio-5); border-radius: var(--radio-pildora); background: var(--fondo); color: var(--texto); box-shadow: var(--sombra-flotante); font-size: var(--letra-lg); font-weight: 700; font-variation-settings: var(--ancho-titulo); }
</style>
</head>
<body>
<div class="tira">
  <select id="variante" aria-label="Variante">
    <option value="a" selected>A · Cabecera oscura</option>
    <option value="b">B · Ficha oscura completa</option>
    <option value="hoy">Hoy · Como está</option>
  </select>
  <select id="clase" aria-label="Clase">
    <option value="festival" selected>Festival · CINEMA</option>
    <option value="exposicion">Exposición · MUNI</option>
    <option value="taller">Taller · Cianotipia</option>
  </select>
</div>
<div class="app" id="app"></div>
<script>
const ic = (n) => `<svg class="i" viewBox="0 0 24 24">${({
  atras: '<path d="M14.5 6l-6 6 6 6"/>',
  puntos: '<circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>',
  pin: '<path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/>',
  chevron: '<path d="M9 6l6 6-6 6"/>',
  ruta: '<path d="M12 3l9 9-9 9-9-9z"/><path d="M9.5 13.5v-2h5l-1.8-1.8M14.5 11.5l-1.8 1.8"/>',
  compartir: '<path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v8.5A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5V11"/>',
  calendarioMas: '<path d="M20 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7.5"/><path d="M3 10h17M8 3v4M15 3v4M18 15v6M15 18h6"/>',
  calendario: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  boleto: '<path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h11A2.5 2.5 0 0 1 20 8.5v1a2.5 2.5 0 0 0 0 5v1a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 15.5v-1a2.5 2.5 0 0 0 0-5z"/>',
  reloj: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  personas: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.5" cy="9" r="2.6"/><path d="M15.5 14.2a4.5 4.5 0 0 1 5 4.3"/>',
  estrella: '<path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4 6.8 19.2l1-5.9L3.5 9.2l5.9-.8z"/>',
  ok: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  descarga: '<path d="M12 4v11M8 11l4 4 4-4M5 20h14"/>',
})[n]}</svg>`;

// Portadas de relleno (en la app es el cartel real, con su texto). `fondo` también es lo que pinta la barra compacta.
const PORTADAS = {
  festival: { fondo: '#2b1414', svg: '<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"><rect width="300" height="200" fill="#2b1414"/><circle cx="215" cy="70" r="62" fill="#c0392b"/><circle cx="215" cy="70" r="18" fill="#2b1414"/><circle cx="185" cy="40" r="9" fill="#2b1414"/><circle cx="245" cy="40" r="9" fill="#2b1414"/><circle cx="185" cy="100" r="9" fill="#2b1414"/><circle cx="245" cy="100" r="9" fill="#2b1414"/><rect x="0" y="128" width="300" height="34" fill="#f2c14e"/><g fill="#2b1414">' + Array.from({ length: 15 }, (_, i) => `<rect x="${6 + i * 20}" y="134" width="10" height="7" rx="1"/><rect x="${6 + i * 20}" y="149" width="10" height="7" rx="1"/>`).join('') + '</g><rect x="22" y="26" width="110" height="14" fill="#f2c14e"/><rect x="22" y="48" width="80" height="8" fill="#e8dcc8"/></svg>' },
  exposicion: { fondo: '#5a3a28', svg: '<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"><rect width="300" height="200" fill="#d9c3a5"/><rect x="0" y="120" width="300" height="80" fill="#b89470"/><ellipse cx="118" cy="62" rx="26" ry="32" fill="#8a4b2d"/><path d="M70 200 C70 130 90 100 118 100 C146 100 166 130 166 200Z" fill="#2f3e46"/><path d="M190 30 l60 10 -8 70 -58 -6z" fill="#e9e1d3" opacity=".9"/><path d="M196 44 l46 8 M194 60 l48 6 M193 76 l44 5" stroke="#8a4b2d" stroke-width="3"/><circle cx="250" cy="160" r="22" fill="#c96b3c" opacity=".85"/></svg>' },
  taller: { fondo: '#1d4e89', svg: '<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"><rect width="300" height="200" fill="#1d4e89"/><g fill="#e8f1fb" opacity=".88"><path d="M60 170 C40 120 70 60 110 40 C120 90 100 140 60 170Z"/><path d="M150 180 C150 120 180 80 230 70 C220 120 190 160 150 180Z"/><path d="M220 40 C240 30 270 34 285 50 C268 64 240 62 220 40Z"/></g><g stroke="#1d4e89" stroke-width="2" fill="none"><path d="M62 166 C80 120 95 80 108 46"/><path d="M152 176 C175 140 200 105 226 74"/></g><circle cx="35" cy="40" r="14" fill="none" stroke="#e8f1fb" stroke-width="3" opacity=".7"/></svg>' },
};
const MINIATURAS = ['#3a1c1c', '#1f3a5a', '#4a3a1c', '#2a2a2a', '#5a2a3a'];

// Datos de producción (lectura pública de somosnosotros.org, 2026-10-08). El taller es hoy un evento puntual de una sesión; aquí se ve como taller.
const CLASES = {
  festival: {
    etiqueta: 'Festival', titulo: 'CINEMA: XV Festival de Cine México-Alemania',
    meta: 'Del 29 de sep al 24 de oct · Programa registrado: 11 actividades',
    kpis: [['calendario', 'Actos', '11'], ['boleto', 'Costo', 'Gratis'], ['pin', 'Sedes', '7']],
    acciones: ['compartir', 'calendario', 'ruta'],
    bloques: () => `<section class="bloque" aria-label="Programa"><h2>Programa</h2>
      <h3>mié 14 de oct</h3>${acto('Chatbot Challenge, obra escénica de Interrobang Performance', '20:00 · $120', 'Centro de las Artes de San Luis Potosí Centenario (CEART)', 0)}
      <h3>vie 16 de oct</h3>${acto('CINEMA: The Future of Music, de Anna Schmidt', '20:00', 'Museo Federico Silva Escultura Contemporánea', 1)}
      <h3>sáb 17 de oct</h3>${acto('CINEMA: El atractivo de la resistencia, concierto y charla de MOTUS NEU jazz', '19:00 · Gratis', 'Museo Federico Silva Escultura Contemporánea', 2)}
      <p class="nota">Programa registrado: 11 actividades</p></section>
      <section class="tarjeta" aria-label="Dónde"><h2>Dónde</h2>${mapa(7)}<ul>${[['Cinema 7B', 2], ['Alboa The Park', 2], ['Museo de Arte Contemporáneo (MAC)', 1], ['Centro de las Artes de San Luis Potosí Centenario (CEART)', 1], ['Museo Federico Silva Escultura Contemporánea', 2], ['Auditorio Rafael Nieto', 2], ['Museo Leonora Carrington', 1]].map(([n, a]) => `<li>${dato('pin', n, `${a} ${a === 1 ? 'actividad' : 'actividades'}`)}</li>`).join('')}</ul></section>`,
    sobre: 'XV edición del festival de cine México-Alemania CINEMA, con el Goethe-Institut y el Centro Cultural Alemán: proyecciones, cortometrajes, un concierto de jazz y una obra escénica, del 29 de septiembre al 24 de octubre en varias sedes de la ciudad.',
    pastillas: ['Me interesa'],
  },
  exposicion: {
    etiqueta: 'Exposición', titulo: 'Esencialismo, exposición de Filippo Giusti',
    meta: 'Hasta el mié 2 de dic · Horario por confirmar',
    kpis: [['calendario', 'Hasta', 'mié 2 dic'], ['boleto', 'Costo', 'Gratis'], ['reloj', 'Horario', 'Por confirmar']],
    acciones: ['compartir', 'calendario', 'ruta', 'cartel'],
    bloques: () => `<section class="bloque" aria-label="Horario"><h2>Horario</h2><ul><li>${dato('reloj', 'Horario por confirmar', 'Pregunta en el lugar antes de ir.', false)}</li><li>${dato('estrella', 'Inauguración', 'viernes 2 de octubre · 19:00')}</li></ul></section>
      <section class="tarjeta" aria-label="Dónde"><h2>Dónde</h2>${mapa(1)}${dato('pin', 'MUNI Museo Universitario UASLP', 'Sierra Leona 550, Lomas de San Luis 2a. Sección, 78210, San Luis Potosí')}</section>`,
    sobre: 'Pintura del artista italiano Filippo Giusti, radicado en San Miguel de Allende: parte de la figura humana y suma texturas e historias personales de quienes retrata. Galería 1 del MUNI, hasta el 2 de diciembre. Entrada libre.',
    pastillas: ['Me interesa'],
  },
  taller: {
    etiqueta: 'Taller', titulo: 'Taller de cianotipia sobre papel: el símbolo como herramienta visual',
    meta: 'jue 8 de oct · 17:00 · Foro lunaria',
    kpis: [['calendario', 'Sesiones', '1'], ['boleto', 'Costo', '$50'], ['personas', 'Cupo', 'Limitado']],
    acciones: ['compartir', 'calendario', 'ruta', 'cartel'],
    bloques: () => `<section class="bloque" aria-label="Sesiones"><h2>Sesiones</h2><ul><li>${dato('calendario', 'jue 8 de oct · 17:00', 'Sesión 1 de 1', false)}</li></ul></section>
      <section class="tarjeta" aria-label="Dónde"><h2>Dónde</h2>${mapa(1)}${dato('pin', 'Foro lunaria', 'Calle Hermenegildo Galeana 423, 78000 San Luis Potosí')}</section>`,
    sobre: 'Taller teórico-práctico de cianotipia sobre papel impartido por Gyne Studio: exploración, creación y proceso, con el símbolo como herramienta visual y narrativa. No hace falta saber dibujar ni de fotografía. Cupo limitado; se reserva comentando la publicación.',
    pastillas: ['Me interesa', 'Voy'],
  },
};
const ACCIONES = { compartir: ['compartir', 'Compartir'], calendario: ['calendarioMas', 'A mi calendario'], ruta: ['ruta', 'Cómo llegar'], cartel: ['descarga', 'Cartel'] };
function acto(t, hora, sitio, i) { return `<div class="lista"><span class="foto" style="background:${MINIATURAS[i % MINIATURAS.length]}"></span><b>${t}</b><span class="hora">${ic('reloj')}${hora}</span><span class="sitio">${ic('pin')}<span>${sitio}</span></span><span class="marcar">${ic('ok')}</span></div>`; }
function dato(i, t, s, angulo = true) { return `<div class="dato">${ic(i)}<b>${t}</b>${s ? `<small>${s}</small>` : ''}${angulo ? ic('chevron') : ''}</div>`; }
// El mapa estático de «Dónde» (en la app, la imagen clara de Mapbox: en la variante B sigue clara salvo que se pida otro estilo).
function mapa(n) {
  const pines = [[300, 120], [140, 70], [420, 160], [230, 180], [380, 60], [470, 90], [190, 140]].slice(0, n);
  return `<div class="mapa" role="img" aria-label="Mapa"><svg viewBox="0 0 600 250" preserveAspectRatio="xMidYMid slice"><rect width="600" height="250" fill="#fafaf8"/><g stroke="#e4e4df" stroke-width="3">${Array.from({ length: 12 }, (_, i) => `<path d="M${i * 52} 0V250"/>`).join('')}${Array.from({ length: 6 }, (_, i) => `<path d="M0 ${i * 46}H600"/>`).join('')}</g><path d="M0 230 L600 40" stroke="#d6d6d2" stroke-width="7"/><g fill="#6d34c8" stroke="#fff" stroke-width="2">${pines.map(([x, y]) => `<path transform="translate(${x - 10} ${y - 26})" d="M10 25s-8.5-8.2-8.5-14.3a8.5 8.5 0 0 1 17 0C18.5 16.8 10 25 10 25z"/>`).join('')}</g></svg></div>`;
}

let variante = 'a', clase = 'festival';
function pintar() {
  const C = CLASES[clase], P = PORTADAS[clase];
  const app = document.getElementById('app');
  app.dataset.variante = variante;
  const kpis = `<ul class="kpis">${C.kpis.map(([i, t, v]) => `<li class="kpi">${ic(i)}<small>${t}</small><b>${v}</b></li>`).join('')}</ul>`;
  const titulo = `<div class="titulo"><span class="etiqueta">${C.etiqueta}</span><h1>${C.titulo}</h1>${variante === 'a' ? `<p class="meta">${C.meta}</p>` : ''}</div>`;
  const acciones = `<div class="acciones">${C.acciones.map((k) => `<button class="accion"><span>${ic(ACCIONES[k][0])}</span>${ACCIONES[k][1]}</button>`).join('')}</div>`;
  app.innerHTML = `<div class="ficha ${variante === 'a' ? 'a' : ''}" style="--portada:${P.fondo}">
    <div class="barra"><button aria-label="Atrás">${ic('atras')}</button><b>${C.titulo}</b><button aria-label="Más">${ic('puntos')}</button></div>
    <figure class="portada" data-portada>${P.svg}</figure>
    ${titulo}
    ${variante === 'a' ? `<div class="numeros">${kpis}</div>` : ''}
    <div class="cuerpo">
      ${variante === 'a' ? '' : `${kpis}<p class="linea">${C.meta}</p>`}
      ${acciones}
      ${C.bloques()}
      <section class="bloque" aria-label="Sobre el evento"><h2>Sobre el evento</h2><p class="texto">${C.sobre}</p></section>
    </div>
    <div class="flotantes">${C.pastillas.map((t) => `<button class="pastilla">${t === 'Voy' ? ic('ok') : ic('estrella')}${t}</button>`).join('')}</div>
  </div>`;
  app.scrollTop = 0;
}
// La barra se vuelve compacta al pasar la portada, como hoy.
document.getElementById('app').addEventListener('scroll', (ev) => {
  const f = ev.target.querySelector('.ficha'); const p = f.querySelector('.portada');
  f.toggleAttribute('data-compacta', ev.target.scrollTop > p.offsetHeight - 72);
});
document.getElementById('variante').addEventListener('change', (ev) => { variante = ev.target.value; pintar(); });
document.getElementById('clase').addEventListener('change', (ev) => { clase = ev.target.value; pintar(); });
pintar();
</script>
</body>
</html>
