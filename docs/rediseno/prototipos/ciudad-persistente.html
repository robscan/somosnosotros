:root{--fuente-bricolage:'Bricolage Grotesque'}
:root {
  color-scheme: light; /* tema claro, sin modo oscuro (DEFINICION) */

  /* Variables de diseño: una sola fuente de verdad para color, aire, forma, capas y medidas. Sus valores son los del
     prototipo firmado de la reestructura de la interfaz (OL-227; doc 50, 5.1). */

  /* Color */
  --fondo: #ffffff;
  --fondo-suave: #f4f4f2;
  --fondo-contenido: #f6f5f1; /* zona de contenido de las pantallas raíz: distinta de la cabecera y la nav, que son blancas */
  --texto: #1a1a1a;
  --texto-suave: #5c5c5c;
  --borde: #dcdcd8;
  --primario: #6d34c8; /* violeta: acciones primarias y estado activo (decisión del founder, 2026-09-23, OL-146/doc rediseno/37: el azul petróleo "es aguado, parecido a eventos a donde voy" y se confundía con el verde de "Sigues") */
  --primario-texto: #ffffff;
  --primario-suave: color-mix(in srgb, var(--primario) 12%, white); /* fondo del estado seleccionado ("✓ Voy"); derivado del primario (doc 37), antes #e3f0f2 fijo */
  --error: #b3261e; /* rojo solo para errores y borrar */
  --error-suave: #fdf3f2; /* fondo de un campo con error */
  --ok: #1f6f43; /* verde: algo ya decidido (Vas, Sigues) — distinto de --primario a propósito, para no invitar a tocarlo otra vez (OL-106) */
  --ok-suave: color-mix(in srgb, var(--ok) 12%, white); /* fondo suave de lo ya decidido; derivado de --ok como --primario-suave */
  --destacado: #d35400; /* naranja cempasúchil: los destacados en el mapa (founder, 2026-09-16); 3.8:1 con el fondo del mapa */
  --destacado-texto: #a94400; /* el mismo naranja para letra: 5.5:1 sobre el fondo de contenido */
  --destacado-suave: #fbebdd; /* fondo de la etiqueta "Destacado" en el panel */
  --sistema-azul: #1a73e8; /* azul de los mapas: el punto de «tú estás aquí» */
  --sistema-azul-halo: color-mix(in srgb, var(--sistema-azul) 18%, transparent); /* el halo que rodea a ese punto */
  --fondo-miniatura: #e6e6e2; /* miniaturas y avatares sin foto */
  --fondo-mapa: #eef0ec; /* tono claro mientras carga el mapa: nunca pantalla negra */
  --asa: #d9d9d9; /* asa del panel inferior */
  --asa-ancho: 36px; /* el asa de una hoja mide 36 × 4 */
  --asa-alto: 4px;
  --vidrio: rgba(255, 255, 255, 0.92); /* rótulos sobre el mapa */
  --velo-titulo: linear-gradient(to top, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.44) 55%, rgba(0, 0, 0, 0)); /* oscurece el pie de una portada para que se lea el título que va encima */
  --velo-barra: rgba(0, 0, 0, 0.6); /* oscurece la portada detrás del título de la barra compacta de una ficha */
  --velo-hoja: rgba(0, 0, 0, 0.32); /* oscurece lo que queda detrás de una hoja */
  --fondo-visor: rgba(0, 0, 0, 0.94); /* el visor de carteles: casi negro, para que el cartel destaque */
  --fondo-video: #14181c; /* el marco de un video mientras carga */
  --fondo-audio: #f2f2f2; /* el marco de un reproductor de audio mientras carga */
  --fondo-pared: #fbfaf8; /* el hueso de la pared de la obra colectiva y del marco de su instantánea: un punto más cálido que el blanco */
  --barra-desplazamiento: rgba(0, 0, 0, 0.28); /* la barra de desplazamiento de la hoja de Lugares cuando llena */
  --sombra: 0 2px 12px rgba(0, 0, 0, 0.08);
  --sombra-panel: 0 -2px 16px rgba(0, 0, 0, 0.1);
  --sombra-flotante: 0 6px 20px rgba(0, 0, 0, 0.22);
  --sombra-asa: 0 0 3px rgba(0, 0, 0, 0.35); /* el asa de la hoja de Lugares */
  --sombra-punto: 0 1px 4px rgba(0, 0, 0, 0.3); /* el punto «tú estás aquí» del mapa */
  --sombra-perilla: 0 1px 3px rgba(0, 0, 0, 0.3); /* la perilla de un interruptor */

  /* El mando de una obra colectiva. Su botón y su aviso de turno siguen brillando en el azul petróleo de antes del violeta (OL-146),
     aunque el botón ya sea violeta: quien decida si pasan al primario cambia solo estas líneas. */
  --mando-brillo: 0 12px 28px rgba(15, 107, 124, 0.35);
  --mando-anillo: 0 0 0 10px rgba(15, 107, 124, 0.22);
  --mando-aviso: 0 10px 24px rgba(15, 107, 124, 0.4);
  --mando-brillo-ok: 0 12px 28px color-mix(in srgb, var(--ok) 35%, transparent); /* encendido: el mismo brillo, en el verde de lo decidido */
  --mando-anillo-ok: 0 0 0 10px color-mix(in srgb, var(--ok) 22%, transparent);
  --contorno-tinta: inset 0 0 0 1px rgba(0, 0, 0, 0.12); /* la muestra de una tinta */
  --contorno-tinta-clara: inset 0 0 0 1.5px rgba(0, 0, 0, 0.32); /* la de la tinta blanca, para verse sobre el fondo claro */

  /* Aire: de 4 a 40, para el espacio entre cosas y el relleno */
  --espacio-1: 4px;
  --espacio-2: 8px;
  --espacio-3: 12px;
  --espacio-4: 16px;
  --espacio-5: 20px;
  --espacio-6: 24px;
  --espacio-7: 32px;
  --espacio-8: 40px;

  /* Forma */
  --radio-chico: 4px; /* fotos de renglón */
  --radio: 8px; /* botones, campos y tarjetas */
  --radio-grande: 12px; /* portadas y tarjetas grandes */
  --radio-hoja: 24px; /* las dos esquinas de arriba de una hoja */
  --radio-pildora: 999px; /* chips, sellos y botones en píldora */

  /* Controles: lo que se toca */
  --control: 44px; /* alto de lo que se toca en barras y cabeceras */
  --toque: 48px; /* alto de botones y campos: cómodo para el pulgar */
  --boton-icono: 48px; /* botón redondo de icono en listas, tarjetas y mapa */
  --boton-icono-grande: 56px; /* botón redondo de icono de las acciones de una ficha */
  --toque-min: 44px; /* mínimo absoluto de cualquier cosa que se pulsa (chips, pestañas, enlaces) */
  --columna-icono: 24px; /* la columna del icono en un renglón: icono | texto | acción */
  --alto-chip: 36px; /* alto que se ve de un chip que se toca; su ::before lo lleva a --toque-min */

  /* Barras */
  --alto-barra: 56px; /* barra de la app (BarraApp) y cabecera interior de una ficha o una tarea: 56 sin la franja de la hora */
  --alto-cabecera: 96px; /* lo que mide ui/Cabecera (fila 52 + pestañas 44); ella lo remide en vivo */
  --alto-nav: 60px; /* la barra de navegación del teléfono (píldora de 32 + etiqueta), sin el área segura */
  --alto-modos: 56px; /* la tira de tipos de la pantalla de alta (Evento · Lugar · Artista), sin el área segura */
  --ancho-carril-nav: 88px; /* la navegación como carril a la izquierda, en tableta y escritorio */

  /* Zonas seguras. `--tope` es el alto de la franja de la hora cuando la página llega hasta arriba (app de iPhone,
     OL-209); en Safari y en la web instalada del iPhone vale 0: ahí el navegador ya deja la página debajo de la hora. */
  --tope: env(safe-area-inset-top, 0px);
  --piso: env(safe-area-inset-bottom, 0px); /* zona segura de abajo (la barra de gestos del iPhone); 0 donde el navegador ya la deja libre */
  --nav-abajo: calc(var(--alto-nav) + var(--piso)); /* lo que ocupa abajo la navegación con su zona segura: la barra del teléfono; desde 792 (el carril), solo la zona segura */

  /* Capas, de abajo arriba. Dos cosas de la misma banda se separan con +1 o −1, nunca con un número suelto. */
  --z-sobre: 1; /* sobre su vecino dentro de la misma caja: un botón sobre el lienzo del mapa, el título sobre la portada */
  --z-pegajoso: 10; /* cabeceras y barras que se quedan pegadas al desplazar; los títulos de día y la tira de letras, justo bajo ellas (−1) */
  --z-flotante: 20; /* fijo al pie sobre el contenido: navegación y barra de acciones; los botones flotantes, +1 */
  --z-barra: 30; /* franja de la hora y avisos con Deshacer, sobre lo flotante */
  --z-hoja: 40; /* hojas que suben desde abajo, con su fondo */
  --z-capa: 50; /* capas a pantalla completa: el visor del cartel; «¿Dónde es?», +1 */
  --z-encima: 60; /* lo que va sobre cualquier capa: la lista flotante; el texto largo, +1 */

  /* Anchos. Una sola columna en cualquier pantalla (decisión de maquetación, 2026-09-14). En el teléfono el gutter es
     20px; en tablet y escritorio crece solo lo que sobra a cada lado de la columna, así el contenido queda centrado en lo que
     la pantalla ocupa (con el carril, la ventana menos el carril). Todo gutter horizontal de página se escribe var(--gutter).
     Los botones y sangrías siguen con --espacio-N. Solo en cajas que van a todo lo ancho de la pantalla: una caja que ya mide
     la columna (ui/Hoja) usa --espacio-5. Desde 1048 las raíces y las fichas pasan a la columna ancha (Armazon.module.css). */
  --columna: 600px; /* ancho de lectura */
  --columna-ancha: 960px; /* ancho de lectura de las raíces y las fichas en escritorio */
  --panel: 400px; /* la lista que va junto al mapa */
  /* Se mide sobre el ancho de la pantalla, que es un contenedor (`container-type` en Armazon.module.css): `100cqw` no cuenta la
     barra de desplazamiento clásica que `100vw` sí incluye (H-38) ni el carril de la navegación. Lo que se pinta fuera de ella
     (lo que sube por portal a `body`) no tiene contenedor y mide la ventana. Se va cuando las plantillas usen `.columna` en vez
     de este gutter. */
  --gutter: max(var(--espacio-5), calc((100cqw - var(--columna)) / 2));

  /* Escala de letra en rem: si la persona agranda el texto en su teléfono, todo crece con él.
     Un punto más grande que con la letra del sistema: la condensada se percibe más chica (LINEA_GRAFICA). */
  --letra-2xs: 0.75rem; /* 12px: etiquetas de la navegación y sellos */
  --letra-xs: 0.875rem; /* 14px: etiquetas en mayúsculas, cuándo */
  --letra-sm: 0.9375rem; /* 15px: detalle, ayuda, error */
  --letra-md: 1.0625rem; /* 17px: texto y campos */
  --letra-lg: 1.125rem; /* 18px: botón principal */
  --letra-xl: 1.1875rem; /* 19px: título de sección y de tarjeta */
  --letra-campo: max(16px, var(--letra-md)); /* la de un campo: nunca baja de 16px, o Safari hace zoom al enfocarlo */
  --letra-2xl: 1.625rem; /* 26px: título de pantalla */
  --letra-3xl: 1.875rem; /* 30px: nombre del lugar o evento */
  --alto-logo: 1.75rem; /* 28px: dibujo SMSNSTRS en la barra de las pantallas raíz */
  --alto-logo-chico: 1.5rem; /* 24px: versión chica, al centro de la barra interior */

  /* Ancho de la letra (eje wdth de Bricolage Grotesque): condensada en todo, un poco más abierta en texto. */
  --ancho-titulo: "wdth" 75;
  --ancho-texto: "wdth" 80;

  --fuente: var(--fuente-bricolage), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* Letra de listas y tarjetas (título y datos de un renglón o una tarjeta): la marca sigue en títulos, KPI y botones */
  --fuente-lista: var(--fuente);
  --ancho-lista-titulo: var(--ancho-titulo);
  --ancho-lista-meta: var(--ancho-texto);
  --letra-lista-titulo: var(--letra-xl); /* 19px */
  --letra-tarjeta-titulo: var(--letra-md); /* 17px */
  --letra-lista-meta: var(--letra-sm); /* 15px */
  --peso-lista-titulo: 700;
  --interlinea-lista: 1.15;

  /* Tarjetas del carril y foto del renglón: las medidas de la pieza y de su esqueleto */
  --tarjeta-mediana: 220px; /* ancho de la tarjeta mediana */
  --tarjeta-mediana-foto: 132px; /* alto de su foto */
  --tarjeta-grande: 165px; /* ancho de la tarjeta de cartel vertical */
  --tarjeta-grande-foto: 248px; /* alto de su foto */
  --tarjeta-chica: 104px; /* lado de la tarjeta redonda de un artista */
  --tarjeta-sola-foto: 264px; /* tope del alto de la foto de una tarjeta sola, que ocupa el ancho del carril */
  --foto-renglon: 56px; /* lado de la foto de un renglón de lista y de su esqueleto (ui/Renglon) */
  --avatar-ficha: 64px; /* avatar redondo dentro del héroe de la ficha de un artista */
  --avatar-perfil: 72px; /* avatar redondo de la cabecera de una persona (Mi perfil y su ficha) */

  /* Movimiento */
  --duracion: 200ms; /* transición corriente: barras, hojas, cabeceras */
  --duracion-ficha: 220ms; /* una ficha al entrar o salir */
  --curva: cubic-bezier(0.22, 0.61, 0.36, 1); /* aceleración de todo lo que se mueve */
  /* Lo que entra y sale con movimiento: la hoja de Lugares con una ficha (`HojaLugares`) y los chips que se ponen o se quitan de la fila de
     contexto (`Chip`); los dos leen esto con `lib/movimiento`. Entra con el resorte «Gentle» de Figma (rigidez 100, amortiguación 15, masa 1:
     rebasa un 2,8 % y queda quieta en unos 0,8 s) y sale con el mismo, recortado donde ya no se ve (la primera vez que llega a su recorrido, a
     los 366 ms). Cada curva trae aquí su respaldo `cubic-bezier`; el resorte de verdad (`linear()`) lo pone el `@supports` de abajo. */
  --duracion-resorte: 800ms;
  --curva-resorte: cubic-bezier(0.35, 0.7, 0.1, 1.15);
  --duracion-salida: 366ms;
  --curva-salida: cubic-bezier(0.25, 0.05, 0.45, 0.9);
  --escala-chip: 0.8; /* de qué tamaño parte un chip al entrar a la fila de contexto y a cuál llega al salir */
}
@supports (animation-timing-function: linear(0, 1)) {
  :root {
    --curva-resorte: linear(0, 0.0275, 0.0969, 0.1914, 0.2982, 0.4081, 0.5143, 0.6124, 0.7, 0.7757, 0.8394, 0.8915, 0.9329, 0.9649, 0.9886, 1.0056, 1.0169, 1.0239, 1.0274, 1.0284, 1.0276, 1.0256, 1.0229, 1.0199, 1.0168, 1.0138, 1.011, 1.0085, 1.0064, 1.0046, 1.0031, 1.0019, 1);
    --curva-salida: linear(0, 0.0233, 0.0828, 0.1654, 0.2608, 0.3611, 0.4604, 0.5546, 0.6411, 0.7183, 0.7855, 0.8426, 0.8901, 0.9287, 0.9592, 0.9826, 1);
  }
}
/* Desde 792 la navegación es un carril a la izquierda (docs/rediseno/50, P7): abajo ya no hay barra, solo la zona segura. */
@media (min-width: 792px) {
  :root {
    --nav-abajo: var(--piso);
  }
}
/* Desde 1048 las tarjetas de cartel vertical crecen (docs/rediseno/50, P10): el carril y su esqueleto siguen los mismos tokens. */
@media (min-width: 1048px) {
  :root {
    --tarjeta-grande: 190px;
    --tarjeta-grande-foto: 285px;
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  height: 100%;
  background: var(--fondo);
  color: var(--texto);
  font-family: var(--fuente);
  font-size: 100%; /* 16px por defecto; respeta el tamaño de texto que la persona eligió en su teléfono */
  line-height: 1.4;
  font-variation-settings: var(--ancho-texto);
  font-optical-sizing: auto; /* a lo grande enseña sus curvas; en texto chico queda limpia */
  font-variant-numeric: tabular-nums; /* horas y fechas alineadas en las listas */
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

/* Títulos: condensados (ancho 75) y en negrita 700; la condensada a 600 se ve floja. */
h1,
h2,
h3 {
  font-variation-settings: var(--ancho-titulo);
  font-weight: 700;
  line-height: 1.15;
  text-wrap: balance;
}

a {
  color: var(--texto);
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}
/* Los campos nunca bajan de 16px: por debajo, Safari hace zoom al enfocar. */
input,
textarea,
select {
  font-size: var(--letra-campo);
}

/* El campo escondido que la lupa de la barra enfoca con el toque (`BarraApp`): fuera de la barra, que en el teléfono se esconde al llegar
   a Buscar, y con 16 px como todos los campos (iOS no hace zoom). */
.cebo-de-teclado {
  position: fixed;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  padding: 0;
  border: 0;
  opacity: 0;
  pointer-events: none;
}

/* La franja de la hora (OL-209): fija, del color de las cabeceras, encima de lo que se desplaza y debajo de las hojas
   (`--z-hoja`). Sin ella, en la app de iPhone el contenido pasaba bajo el reloj al desplazar. Donde `--tope` vale 0 no
   se ve. */
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: var(--tope);
  background: var(--fondo);
  z-index: var(--z-barra);
  pointer-events: none;
}

/* Ancho de un bloque (doc 50, 5.3): la página no lleva aire a los lados y cada bloque pone el suyo. `.columna` mide como mucho la
   columna más su aire y se centra sola, sin medir la ventana (H-38); lo que llega a los dos bordes (un carril, una barra, una
   portada) no lleva clase: ocupa la rejilla entera. */
.columna {
  width: 100%;
  max-width: calc(var(--columna) + 2 * var(--espacio-5));
  margin-inline: auto;
  padding-inline: var(--espacio-5);
}
/* Una tira que se desliza de lado y todavía tiene más a la derecha (`useTiraQueSigue` le pone `data-sigue`): su borde
   derecho se desvanece, para que no parezca que termina ahí (H-11). */
[data-sigue] {
  mask-image: linear-gradient(to right, #000 calc(100% - var(--espacio-6)), transparent);
}

.titulo {
  font-size: var(--letra-2xl);
  font-weight: 700;
  margin-bottom: var(--espacio-2);
}

.subtitulo {
  color: var(--texto-suave);
  margin-bottom: var(--espacio-5);
}

/* Enlaces legales al pie de Entrar y Mi perfil */
.nota-legal {
  margin-top: var(--espacio-5);
  color: var(--texto-suave);
  font-size: var(--letra-sm);
  line-height: 1.4;
}
.nota-legal a {
  color: var(--texto-suave);
}

.aviso-error {
  color: var(--error);
  margin: var(--espacio-3) 0;
}

.aviso-ok {
  background: var(--fondo-suave);
  border-radius: var(--radio);
  padding: var(--espacio-4);
  margin: var(--espacio-3) 0;
}

/* El toque responde al instante: sin espera de doble toque y con estado de pulsado visible. */
a,
button,
[role="button"],
label,
input,
select {
  touch-action: manipulation;
}
a:active,
button:active:not(:disabled) {
  opacity: 0.6;
  transition: opacity 0s;
}

/* Solo dentro de la app instalada de iPhone (Capacitor añade "SomosNosotrosApp" al user-agent; la clase la pone
   `src/lib/appNativa.ts` en <html>, antes de que React pinte nada): sin el menú nativo "Copy · Look Up · Translate"
   al mantener pulsado un texto ni el resaltado gris al tocar — se siente como parte de la app, no como una página
   web (OL-205, auditoría OL-202 problema 4). Nunca en el navegador normal (Safari, Chrome): sin la clase, estas
   reglas no existen. Los campos de formulario, los enlaces y los textos largos que la gente puede querer copiar o
   citar (`Desplegable.module.css` en fichas, `legal.module.css` en Reglas/Privacidad) quedan fuera a propósito. */
.app-nativa * {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
}
.app-nativa input,
.app-nativa textarea,
.app-nativa select,
.app-nativa [contenteditable="true"] {
  -webkit-touch-callout: default;
  -webkit-user-select: text;
}
.app-nativa a {
  -webkit-touch-callout: default;
  -webkit-user-select: text;
  -webkit-tap-highlight-color: transparent;
}

/* Foco visible solo cuando se navega con teclado (o lector de pantalla), nunca tras un toque. */
:focus-visible {
  outline: 2px solid var(--primario);
  outline-offset: 2px;
}
:focus:not(:focus-visible) {
  outline: none;
}

/* Quien pidió menos movimiento en su teléfono no ve animaciones ni transiciones. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

</style></head><body><div id="app"></div><script type="text/plain" id="fuente-prototipo-react">import React,{useMemo,useSyncExternalStore} from 'react';
import {createRoot} from 'react-dom/client';
import Armazon from '@/components/Armazon';import BarraApp from '@/components/BarraApp';import NavSecciones from '@/components/NavSecciones';
import Cabecera from '@/components/ui/Cabecera';import Ciudad from '@/components/Ciudad';import FilaEventos from '@/components/FilaEventos';import FilaLugares from '@/app/lugares/FilaLugares';
import {Pestana,Pestanas} from '@/components/ui/Pestanas';import Grupo from '@/components/ui/Grupo';import RenglonEvento from '@/components/RenglonEvento';import Renglon from '@/components/ui/Renglon';import Boton from '@/components/ui/Boton';import {IconoPersona} from '@/components/ui/Iconos';import CarrilEventosCliente from '@/components/inicio/CarrilEventosCliente';import {useAsistenciaEnLista} from '@/components/useAsistenciaEnLista';import HojaLugares from '@/app/lugares/HojaLugares';
import {calcularCarrilesAgenda} from '@/lib/inicio';import {armarCiudades,CIUDAD_INICIAL,slugDeCiudad} from '@/lib/ciudad';import {tarjetaEvento} from '@/lib/destacados';import {agruparPorDia,compararEventos,listarAgenda} from '@/lib/agenda';import {SIN_ELECCION} from '@/lib/lugares';
import plantilla from '@/components/ui/Plantilla.module.css';import comun from '@/components/Lista.module.css';import lugaresCSS from '@/app/lugares/lugares.module.css';
const P=window.__ciudadPrototipo,ahora=new Date('2026-10-04T12:00:00-06:00'),hoy='2026-10-04';
const tour=[['Ciudad de México','2026-10-16'],['Puebla','2026-10-17'],['Morelia','2026-10-18'],['Monterrey','2026-11-08'],['León','2026-11-14'],['Aguascalientes','2026-11-15']];
// Solo los nombres de ciudad, título de la gira y fechas son reales. Todo lo demás es dato de muestra.
function evento(ciudad,dia,n=1,titulo='Un León Marinero'){return {id:'muestra-'+slugDeCiudad(ciudad)+'-'+n,slug:'muestra-'+slugDeCiudad(ciudad)+'-'+n,titulo,inicio:dia+'T19:00:00-06:00',fin:dia+'T21:00:00-06:00',zona:'America/Mexico_City',creado_en:'2026-09-20T12:00:00Z',ciudad,lugar:null,imagen:null,van:0,precio:null,sitio_texto:'Foro de muestra',sitio_reservado:false}}
const catalog=armarCiudades(['San Luis Potosí','San Miguel de Allende','Guadalajara'].map(ciudad=>({ciudad,lat:CIUDAD_INICIAL.centro.lat,lng:CIUDAD_INICIAL.centro.lng})),[...tour.map(([ciudad])=>({ciudad})),{ciudad:'San Luis Potosí'}]);
if(P.caso==='buscador')for(const c of catalog)if(!c.eventos)c.eventos=1;
function datos(ciudad){let eventos=ciudad.slug==='san-luis-potosi'?[evento(ciudad.nombre,'2026-10-06',1,'Encuentro de muestra')]:tour.filter(([c])=>slugDeCiudad(c)===ciudad.slug).map(([c,d])=>evento(c,d));
 if(P.caso==='buscador'&&!eventos.length)eventos=[evento(ciudad.nombre,'2026-11-20')];
 if(P.caso==='varios')eventos=Array.from({length:24},(_,i)=>evento(ciudad.nombre,new Date(Date.UTC(2026,10,14+i)).toISOString().slice(0,10),i+1,'Evento de muestra '+(i+1)));
 if(P.caso==='vacio')eventos=[];
 return {eventos,asistencias:P.caso==='planes'&&eventos[0]?{[eventos[0].id]:'voy'}:null,seguidos:null,eventosSeguidos:[],destacados:[]};}
const subscribe=f=>{window.addEventListener('proto:navegar',f);return()=>window.removeEventListener('proto:navegar',f)};
function Empty({kind,ciudad}){return <div className={comun.vacio}><h2>{kind==='agenda'?'Próximos días':kind==='lugares'?'Lugares':'Artistas'}</h2><p>{kind==='agenda'?`Aún no hay eventos próximos en ${ciudad.nombre}. Si sabes de uno, publícalo.`:kind==='lugares'?`Aún no hay lugares en ${ciudad.nombre}. Registra el primero.`:`Aún no hay fichas de artista registradas en ${ciudad.nombre}. ¿Eres artista o grupo, o conoces a alguien? Registra la ficha.`}</p>{kind!=='agenda'&&<Boton href={'/entrar?siguiente='+encodeURIComponent('/nuevo?tipo='+(kind==='lugares'?'lugar':'artista')+'&ciudad='+ciudad.slug)} variante="secundario">{kind==='lugares'?'Registrar un lugar':'Registrar artista'}</Boton>}</div>}

let content;
if(P.path==='/lugares'){
 const muestra=ciudad.lugares?[{id:'lugar-muestra',nombre:'Lugar de muestra',tipo:'foro',ciudad:ciudad.nombre,proximo:null,portada:null}]:[];
 content=<main className={lugaresCSS.lugares}><Cabecera contexto={<FilaLugares ciudad={ciudad} ciudades={catalog} hrefDeCiudad={href} lugares={muestra} hoy={hoy} seguidos={null} conSesion={false} valor={SIN_ELECCION} onCambiar={()=>{}}/>}/><div className={lugaresCSS.mapa} data-techo-hoja style={{background:'var(--fondo-mapa)'}} aria-label="Mapa de muestra sin conexión"/><HojaLugares resumen={`${muestra.length} ${muestra.length===1?'lugar':'lugares'}`} ficha={null} alAsentar={()=>{}}>{muestra.length?<Grupo><Renglon href="/lugares/muestra" titulo="Lugar de muestra" foto={null}>Foro</Renglon></Grupo>:<section className={comun.vacio}><h2>Lugares</h2><p>Aún no hay lugares en {ciudad.nombre}. Registra el primero.</p><Boton href={'/entrar?siguiente='+encodeURIComponent('/nuevo?tipo=lugar&ciudad='+ciudad.slug)} variante="secundario">Registrar un lugar</Boton></section>}</HojaLugares></main>;
}else if(P.path==='/artistas'){
 const artistas=catalog.filter(c=>['san-luis-potosi','ciudad-de-mexico'].includes(c.slug)).map(c=>({...c,artistas:1}));
 content=<main className={plantilla.raiz}><Cabecera contexto={<Ciudad ciudad={ciudad} ciudades={artistas} seccion="artistas" hrefDe={href}/>}/>{['san-luis-potosi','ciudad-de-mexico'].includes(ciudad.slug)?<Grupo titulo="A"><Renglon href="/artistas/muestra" titulo="Artista de muestra" foto={null}>Música</Renglon></Grupo>:<Empty kind="artistas" ciudad={ciudad}/>}</main>;
}else if(P.path==='/agenda'){
 const lista=listarAgenda(agenda,P.filtros);content=<main className={plantilla.raiz}><Cabecera contexto={contexto}><Pestanas ariaLabel="Eventos"><Pestana activa={P.ver==='todos'} onClick={()=>P.tab('todos')}>Todos</Pestana><Pestana activa={P.ver==='nuevos'} onClick={()=>P.tab('nuevos')}>Nuevos</Pestana></Pestanas></Cabecera>{P.ver==='nuevos'?<div className={comun.vacio}><p>Nada nuevo desde tu última visita.</p></div>:lista.length?agruparPorDia(lista,ahora,P.filtros.cuando?.desde).map(g=><Grupo key={g.clave} titulo={g.titulo} cuenta={g.eventos.length}>{g.eventos.map(e=><RenglonEvento key={e.id} evento={e} boton={asistencia.boton(e)}/>)}</Grupo>):P.filtros.cuando||P.filtros.cuanto.length?<div className={comun.vacio}><h2>{P.filtros.cuando?'En esas fechas':'Próximos días'}</h2><p>No hay nada con lo que elegiste. Cambia o quita algún filtro para ver más.</p></div>:<Empty kind="agenda" ciudad={ciudad}/>}</main>;
}else{
 const c=calcularCarrilesAgenda(agenda,ahora),planes=new Set(Object.keys(agenda.asistencias??{}));
 const adelante=!c.estelar.length&&!c.estaSemana.length&&!c.nuevos.length?agenda.eventos.filter(e=>!planes.has(e.id)).toSorted(compararEventos).slice(0,20):[];
 const bloques=[['Tus planes',agenda.eventos.filter(e=>planes.has(e.id)),'mediana'],[c.titulo,c.estelar,'grande'],['Esta semana',c.estaSemana,'mediana'],['Nuevos eventos',c.nuevos,'mediana'],['Más adelante',adelante,'mediana']];
 content=<main className={plantilla.raiz}><Cabecera contexto={contexto}/>{bloques.filter(([,ev])=>ev.length).map(([titulo,ev,tamano])=><CarrilEventosCliente key={titulo} titulo={titulo} asistencias={agenda.asistencias} avisos={null} tusPlanes={titulo==='Tus planes'} tarjetas={ev.map(e=>tarjetaEvento(e,ahora))} tamano={tamano} memoria={'proto-'+ciudad.slug+'-'+titulo} verTodos={{href:titulo==='Tus planes'?'/perfil':'/agenda?ciudad='+ciudad.slug,etiqueta:titulo==='Tus planes'?'Ver mi perfil':'Ver la agenda'}}/>)}</main>;
}
return <Armazon barra={<BarraApp admin={null} sesion={null}/>} nav={<NavSecciones perfil={<IconoPersona width={26} height={26}/>}/>}>{content}</Armazon>;
}
createRoot(document.getElementById('app')).render(<Screen/>);
