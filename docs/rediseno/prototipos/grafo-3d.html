<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafo cultural en 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
/* Prototipo OL-393 (bitácora 424): el grafo cultural en tres dimensiones. Lugares en su posición geográfica real a escala
   (1 unidad = 10 m alrededor del centro de los lugares de San Luis Potosí), artistas flotando sobre el lugar donde más tocan,
   asistentes anónimos debajo (posición INVENTADA: la base no guarda dónde está nadie), y los artistas sin ninguna conexión en
   un anillo exterior. Datos reales de solo lectura del 12 de octubre de 2026, anonimizados: ninguna persona lleva nombre ni id.
   Referencia del founder: el Preset Explorer de Absynth (nube al centro, árbol a la izquierda, lista a la derecha, profundizar al tocar).
   Maquetación plana: una rejilla con áreas; en el teléfono las columnas son hojas. Tokens de la línea gráfica; tema oscuro por omisión
   (el fondo de la cabecera oscura de la app, `--banda`), con el claro a un toque. */
:root {
  --fuente: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --ancho-titulo: "wdth" 75; --ancho-texto: "wdth" 80;
  --primario: #6d34c8; --tinta: #1a1a1a; --crema: #f6f5f1; --destacado: #d35400; --banda: #141414; --ok: #1f6f43;
  --espacio-1: 4px; --espacio-2: 8px; --espacio-3: 12px; --espacio-4: 16px; --espacio-5: 20px; --espacio-6: 24px;
  --radio: 8px; --radio-grande: 12px; --radio-hoja: 24px; --toque: 48px; --toque-min: 44px;
  --letra-2xs: 0.75rem; --letra-xs: 0.875rem; --letra-sm: 0.9375rem; --letra-md: 1.0625rem; --letra-xl: 1.1875rem; --letra-2xl: 1.625rem;
  --duracion: 200ms; --curva: cubic-bezier(0.22, 0.61, 0.36, 1);
  /* Tema oscuro (por omisión): fondo de la cabecera oscura de la app. */
  --fondo: var(--banda); --panel: rgba(255, 255, 255, 0.06); --panel-opaco: #1f1f1f; --borde: rgba(255, 255, 255, 0.14);
  --texto: #f6f5f1; --texto-suave: rgba(246, 245, 241, 0.62); --sombra: 0 6px 20px rgba(0, 0, 0, 0.45);
  --c-lugar: #8a5cf0; --c-artista: #f6f5f1; --c-persona: #e8742a; --c-suelto: #5a5a5a; --c-sel: #ffffff;
}
:root[data-tema="claro"] {
  --fondo: var(--crema); --panel: rgba(255, 255, 255, 0.8); --panel-opaco: #ffffff; --borde: #dcdcd8;
  --texto: var(--tinta); --texto-suave: #5c5c5c; --sombra: 0 2px 12px rgba(0, 0, 0, 0.08);
  --c-lugar: #6d34c8; --c-artista: #1a1a1a; --c-persona: #d35400; --c-suelto: #c2c1bb; --c-sel: #1a1a1a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--fuente); font-variation-settings: var(--ancho-texto); font-optical-sizing: auto; background: var(--fondo); color: var(--texto); overflow: hidden; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3 { margin: 0; font-variation-settings: var(--ancho-titulo); font-weight: 700; }

/* La rejilla: barra arriba, y debajo árbol · escena · lista. En el teléfono solo la escena; árbol y lista son hojas. */
.app { height: 100%; display: grid; grid-template-rows: var(--toque) 1fr; grid-template-columns: 1fr; grid-template-areas: "barra" "escena"; }
@media (min-width: 792px) {
  .app { grid-template-columns: 260px 1fr 300px; grid-template-areas: "barra barra barra" "arbol escena lista"; }
}
.barra { grid-area: barra; display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: var(--espacio-3); padding: 0 var(--espacio-4); border-bottom: 1px solid var(--borde); background: var(--fondo); z-index: 3; }
.barra h1 { font-size: var(--letra-xl); white-space: nowrap; }
.barra .cifras { font-size: var(--letra-xs); color: var(--texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra .fps { font-variant-numeric: tabular-nums; font-size: var(--letra-xs); color: var(--texto-suave); }
.pildora { height: 32px; padding: 0 var(--espacio-3); border: 1px solid var(--borde); border-radius: 999px; font-size: var(--letra-xs); color: var(--texto); background: var(--panel); white-space: nowrap; }
.pildora[aria-pressed="true"] { background: var(--texto); color: var(--fondo); border-color: var(--texto); }

.escena { grid-area: escena; position: relative; min-height: 0; }
.escena canvas { display: block; width: 100%; height: 100%; touch-action: none; }

/* El árbol (izquierda) y la lista (derecha) */
.arbol, .lista { grid-area: arbol; overflow: auto; padding: var(--espacio-3) var(--espacio-4) calc(var(--espacio-6) + env(safe-area-inset-bottom)); background: var(--fondo); border-right: 1px solid var(--borde); font-size: var(--letra-sm); }
.lista { grid-area: lista; border-right: 0; border-left: 1px solid var(--borde); }
.arbol h2, .lista h2 { font-size: var(--letra-2xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--texto-suave); margin: var(--espacio-4) 0 var(--espacio-2); font-weight: 600; }
.arbol ul, .lista ul { list-style: none; margin: 0; padding: 0; }
.arbol li li { padding-left: var(--espacio-5); }
.fila { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: var(--espacio-2); width: 100%; min-height: 36px; padding: 0 var(--espacio-2); border-radius: var(--radio); text-align: left; }
.fila:hover { background: var(--panel); }
.fila[aria-pressed="true"], .fila[aria-current="true"] { background: var(--panel); outline: 1px solid var(--borde); }
.fila .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--texto-suave)); }
.fila .n { font-size: var(--letra-2xs); color: var(--texto-suave); font-variant-numeric: tabular-nums; }
.fila b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila small { display: block; color: var(--texto-suave); font-size: var(--letra-2xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ajuste { display: grid; grid-template-columns: 1fr auto; gap: var(--espacio-2); align-items: center; min-height: 36px; font-size: var(--letra-xs); color: var(--texto-suave); }
.ajuste input[type="range"] { width: 110px; accent-color: var(--c-lugar); }
.ajuste input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--c-lugar); }
.nota { font-size: var(--letra-2xs); color: var(--texto-suave); line-height: 1.35; margin: var(--espacio-2) 0; }

/* En el teléfono, árbol y lista son hojas que entran de lado y de abajo. */
@media (max-width: 791px) {
  .arbol, .lista { position: fixed; z-index: 5; box-shadow: var(--sombra); transition: transform var(--duracion) var(--curva); }
  .arbol { top: var(--toque); bottom: 0; left: 0; width: min(84vw, 320px); transform: translateX(-100%); border-right: 1px solid var(--borde); }
  .lista { left: 0; right: 0; bottom: 0; max-height: 60vh; padding-top: var(--espacio-5); border-radius: var(--radio-hoja) var(--radio-hoja) 0 0; border: 1px solid var(--borde); transform: translateY(100%); }
  .app[data-hoja="arbol"] .arbol, .app[data-hoja="lista"] .lista { transform: none; }
  .velo { position: fixed; inset: var(--toque) 0 0; background: rgba(0, 0, 0, 0.32); z-index: 4; opacity: 0; pointer-events: none; transition: opacity var(--duracion); }
  .app[data-hoja] .velo { opacity: 1; pointer-events: auto; }
}

/* Botones flotantes sobre la escena: hojas (abajo a la izquierda) y el mando de cámara (abajo a la derecha). */
.botones-hojas { position: absolute; left: var(--espacio-4); bottom: calc(var(--espacio-4) + env(safe-area-inset-bottom)); display: flex; gap: var(--espacio-2); z-index: 2; }
.flotante { height: var(--toque-min); padding: 0 var(--espacio-4); border-radius: 999px; background: var(--panel-opaco); color: var(--texto); border: 1px solid var(--borde); box-shadow: var(--sombra); font-size: var(--letra-sm); font-weight: 600; }
.mando { position: absolute; right: var(--espacio-4); bottom: calc(var(--espacio-4) + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 2px; z-index: 2; }
.mando button { width: 40px; height: 40px; border-radius: var(--radio); background: var(--panel-opaco); border: 1px solid var(--borde); color: var(--texto); font-size: var(--letra-md); box-shadow: var(--sombra); display: grid; place-items: center; }
.mando button:active { background: var(--texto); color: var(--fondo); }
.mando .mas { grid-column: 3; grid-row: 1; } .mando .menos { grid-column: 3; grid-row: 3; }
.mando .arriba { grid-column: 2; grid-row: 1; } .mando .abajo { grid-column: 2; grid-row: 3; }
.mando .izq { grid-column: 1; grid-row: 2; } .mando .der { grid-column: 3; grid-row: 2; } .mando .centro { grid-column: 2; grid-row: 2; }
.mando svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* El rótulo del nodo elegido, pegado a su esfera, y la tarjeta con sus números. */
.rotulo { position: absolute; left: 0; top: 0; transform: translate(-50%, calc(-100% - 14px)); padding: 4px 10px; border-radius: 999px; background: var(--c-sel); color: var(--fondo); font-size: var(--letra-xs); font-weight: 600; white-space: nowrap; pointer-events: none; display: none; max-width: 70vw; overflow: hidden; text-overflow: ellipsis; }
.rotulo.vecino { background: var(--panel-opaco); color: var(--texto); font-weight: 500; opacity: 0.9; font-size: var(--letra-2xs); }
.tarjeta { position: absolute; left: var(--espacio-4); right: var(--espacio-4); top: var(--espacio-3); z-index: 2; display: none; grid-template-columns: 12px 1fr auto; align-items: start; gap: var(--espacio-3); padding: var(--espacio-3) var(--espacio-4); border-radius: var(--radio-grande); background: var(--panel-opaco); border: 1px solid var(--borde); box-shadow: var(--sombra); }
.tarjeta[data-abierta="true"] { display: grid; }
.tarjeta .punto { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; background: var(--c); }
.tarjeta h3 { font-size: var(--letra-md); line-height: 1.2; }
.tarjeta p { margin: 2px 0 0; font-size: var(--letra-xs); color: var(--texto-suave); }
.tarjeta .cerrar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--texto-suave); }
@media (min-width: 792px) { .tarjeta { left: var(--espacio-4); right: auto; max-width: 360px; } }
.leyenda { position: absolute; left: var(--espacio-4); bottom: calc(var(--toque) + var(--espacio-5) + env(safe-area-inset-bottom)); display: grid; gap: 2px; font-size: var(--letra-2xs); color: var(--texto-suave); pointer-events: none; z-index: 1; }
@media (min-width: 792px) { .leyenda { bottom: var(--espacio-4); } }
.leyenda span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--c); vertical-align: middle; }
@media (min-width: 792px) { .velo, .botones-hojas { display: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="barra">
    <h1>Grafo cultural</h1>
    <div class="cifras" id="cifras"></div>
    <div class="fps" id="fps" title="cuadros por segundo mientras algo se mueve">en reposo</div>
    <button class="pildora" id="tema" aria-pressed="false">Claro</button>
  </header>

  <nav class="arbol" id="arbol" aria-label="Filtros"></nav>

  <main class="escena" id="escena">
    <canvas id="lienzo"></canvas>
    <div class="rotulo" id="rotulo"></div>
    <div class="rotulos-vecinos" id="vecinos"></div>
    <section class="tarjeta" id="tarjeta" aria-live="polite"></section>
    <div class="leyenda">
      <span style="--c: var(--c-lugar)">Lugar · en su posición real</span>
      <span style="--c: var(--c-artista)">Artista · sobre el lugar donde más toca</span>
      <span style="--c: var(--c-persona)">Asistente · anónimo, posición inventada</span>
    </div>
    <div class="botones-hojas">
      <button class="flotante" id="abrir-arbol">Filtros</button>
      <button class="flotante" id="abrir-lista">Lista</button>
    </div>
    <div class="mando" aria-label="Cámara">
      <button class="arriba" data-mando="arriba" aria-label="Inclinar hacia arriba"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="mas" data-mando="mas" aria-label="Acercar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="izq" data-mando="izq" aria-label="Girar a la izquierda"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="centro" data-mando="centro" aria-label="Volver al centro"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></button>
      <button class="der" data-mando="der" aria-label="Girar a la derecha"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="abajo" data-mando="abajo" aria-label="Inclinar hacia abajo"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="menos" data-mando="menos" aria-label="Alejar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    </div>
  </main>

  <aside class="lista" id="lista" aria-label="Lista"></aside>
  <div class="velo" id="velo"></div>
</div>

  if (n.suelto && !mostrarSueltos) return false;
  if (!filtro.tipo) return true;
  if (filtro.tipo === "sueltos") return n.tipo === "artista" && n.suelto;

// El mando de flechas: girar, inclinar, acercar, alejar, centro. Mantener pulsado repite.
let repetir = null;
function mando(q) {
  if (q === "izq") cam.theta -= 0.12; if (q === "der") cam.theta += 0.12; if (q === "arriba") cam.phi -= 0.08; if (q === "abajo") cam.phi += 0.08;
  if (q === "mas") cam.distancia *= 0.82; if (q === "menos") cam.distancia /= 0.82;
  if (q === "centro") { cam.objetivo.copy(camInicial.objetivo); cam.distancia = camInicial.distancia; cam.theta = camInicial.theta; cam.phi = camInicial.phi; }
  acotar(); pedirCuadro();
}
document.querySelectorAll("[data-mando]").forEach((b) => {
  b.addEventListener("pointerdown", (ev) => { ev.preventDefault(); mando(b.dataset.mando); clearInterval(repetir); repetir = setInterval(() => mando(b.dataset.mando), 90); });
  for (const t of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(t, () => clearInterval(repetir));
});
window.addEventListener("keydown", (ev) => { const k = { ArrowLeft: "izq", ArrowRight: "der", ArrowUp: "arriba", ArrowDown: "abajo", "+": "mas", "-": "menos", Home: "centro" }[ev.key]; if (k) { ev.preventDefault(); mando(k); } if (ev.key === "Escape") seleccionar(-1); });

// Tocar un nodo: el más cercano en pantalla al dedo (con un margen de 22 px: tocar una esfera chica a lo lejos sería imposible con un rayo exacto).
const v3 = new THREE.Vector3();
function proyectar(n, destino) { destino.set(n.x, n.y * factorAltura, n.z).project(camara); const r = lienzo.getBoundingClientRect(); return { x: (destino.x + 1) / 2 * r.width + r.left, y: (1 - destino.y) / 2 * r.height + r.top, dentro: destino.z < 1 }; }
function elegirEnPantalla(px, py) {
  let mejor = -1, mejorD = Infinity;
  for (let i = 0; i < nodos.length; i++) {
    if (!visible[i]) continue; const p = proyectar(nodos[i], v3); if (!p.dentro) continue;
    const rPx = radio(nodos[i]) / (cam.distancia * 0.0011) ; // radio aparente aproximado
    const d = Math.hypot(p.x - px, p.y - py) - Math.min(rPx, 40);
    if (d < mejorD) { mejorD = d; mejor = i; }
  }
  if (mejor >= 0 && mejorD < 22) seleccionar(mejor, false); else seleccionar(-1);
}

// ---------- Rótulo pegado al nodo elegido y a sus vecinos ----------
const rotulo = document.getElementById("rotulo"), capaVecinos = document.getElementById("vecinos");
function pintarRotulos() {
  if (seleccion < 0) { rotulo.style.display = "none"; capaVecinos.replaceChildren(); return; }
  const p = proyectar(nodos[seleccion], v3); const r = lienzo.getBoundingClientRect();
  rotulo.style.display = p.dentro ? "block" : "none"; rotulo.style.transform = `translate(${(p.x - r.left).toFixed(0)}px, ${(p.y - r.top).toFixed(0)}px) translate(-50%, calc(-100% - ${(radio(nodos[seleccion]) / (cam.distancia * 0.0011) + 10).toFixed(0)}px))`;
  rotulo.textContent = nodos[seleccion].nombre;
  const hijos = []; let k = 0;
  for (const i of resaltados) { if (k++ > 14) break; const q = proyectar(nodos[i], v3); if (!q.dentro) continue; const d = document.createElement("div"); d.className = "rotulo vecino"; d.style.display = "block"; d.style.transform = `translate(${(q.x - r.left).toFixed(0)}px, ${(q.y - r.top).toFixed(0)}px) translate(-50%, -140%)`; d.textContent = nodos[i].nombre; hijos.push(d); }
  capaVecinos.replaceChildren(...hijos);
}

// ---------- Tarjeta del elegido ----------
const tarjeta = document.getElementById("tarjeta");
function plural(n, s, p) { return `${n} ${n === 1 ? s : p}`; }
function pintarTarjeta() {
  if (seleccion < 0) { tarjeta.dataset.abierta = "false"; return; }
  const n = nodos[seleccion]; const c = n.tipo === "persona" ? "var(--c-persona)" : n.tipo === "lugar" ? "var(--c-lugar)" : "var(--c-artista)";
  let linea1, linea2;
  if (n.tipo === "lugar") { linea1 = `${ETIQUETA[n.clase] || n.clase} · ${n.ciudad}`; linea2 = `${plural(n.seguidores, "seguidor", "seguidores")} · ${plural(n.asistentes, "asistencia", "asistencias")} · ${plural(n.eventos, "evento", "eventos")}${n.proximos ? ` (${n.proximos} próximos)` : ""}`; }
  else if (n.tipo === "artista") { linea1 = `${ETIQUETA[n.clase] || n.clase}${n.ciudad !== "San Luis Potosí" ? ` · ${n.ciudad}` : ""}${n.suelto ? " · sin conexión" : n.sitioLibre ? " · solo en sitios libres" : ` · en ${plural(n.lugares, "lugar", "lugares")}`}`; linea2 = `${plural(n.seguidores, "seguidor", "seguidores")} · ${plural(n.asistentes, "asistencia", "asistencias")} · ${plural(n.fechas, "fecha", "fechas")}`; }
  else { linea1 = "Asistente · sin nombre ni perfil"; linea2 = `Actividad ${["baja", "media", "alta"][n.tramo - 1]} · posición inventada (la base no guarda dónde está nadie)`; }
  const conexiones = vecinos[seleccion].length;
  tarjeta.innerHTML = `<span class="punto" style="--c:${c}"></span><div><h3></h3><p>${linea1}</p><p>${linea2} · ${plural(conexiones, "conexión", "conexiones")}</p></div><button class="cerrar" aria-label="Cerrar">✕</button>`;
  tarjeta.querySelector("h3").textContent = n.nombre; tarjeta.dataset.abierta = "true";
  tarjeta.querySelector(".cerrar").onclick = () => seleccionar(-1);
}

// ---------- Árbol de filtros (izquierda) ----------
const arbol = document.getElementById("arbol");
function cuenta(f) { return nodos.filter(f).length; }
function fila(etiqueta, n, color, activo, onclick, sub) {
  const b = document.createElement("button"); b.className = "fila"; b.setAttribute("aria-pressed", String(activo));
  b.innerHTML = `<span class="punto" style="--c:${color}"></span><span><b></b>${sub ? "<small></small>" : ""}</span><span class="n">${n}</span>`;
  b.querySelector("b").textContent = etiqueta; if (sub) b.querySelector("small").textContent = sub; b.onclick = onclick; return b;
}
function pintarArbol() {
  const ul = document.createElement("ul");
  const li = (hijo) => { const l = document.createElement("li"); l.append(hijo); ul.append(l); return l; };
  li(fila("Todo", nodos.length, "var(--texto-suave)", !filtro.tipo, () => ponerFiltro(null, null)));
  // Lugares › tipo
  const lLug = li(fila("Lugares", DATOS.lugares.length, "var(--c-lugar)", filtro.tipo === "lugar" && !filtro.clase, () => ponerFiltro("lugar", null)));
  const tipos = {}; for (const l of DATOS.lugares) tipos[l.tipo] = (tipos[l.tipo] || 0) + 1;
  const ulL = document.createElement("ul"); for (const [t, n] of Object.entries(tipos).sort((a, b) => b[1] - a[1])) { const x = document.createElement("li"); x.append(fila(ETIQUETA[t] || t, n, "var(--c-lugar)", filtro.tipo === "lugar" && filtro.clase === t, () => ponerFiltro("lugar", t))); ulL.append(x); } lLug.append(ulL);
  // Artistas › disciplina
  const lArt = li(fila("Artistas", DATOS.artistas.length, "var(--c-artista)", filtro.tipo === "artista" && !filtro.clase, () => ponerFiltro("artista", null)));
  const disc = {}; for (const a of DATOS.artistas) disc[a.disciplina] = (disc[a.disciplina] || 0) + 1;
  const ulA = document.createElement("ul");
  const add = (et, n, activo, f, sub) => { const x = document.createElement("li"); x.append(fila(et, n, "var(--c-artista)", activo, f, sub)); ulA.append(x); };
  add("Con lugar", DATOS.resumen.artistasConectados, filtro.tipo === "artista" && filtro.clase === "conectados", () => ponerFiltro("artista", "conectados"), "flotan sobre el lugar donde más tocan");
  for (const [t, n] of Object.entries(disc).sort((a, b) => b[1] - a[1])) add(ETIQUETA[t] || t, n, filtro.tipo === "artista" && filtro.clase === t, () => ponerFiltro("artista", t));
  lArt.append(ulA);
  li(fila("Solo en sitios libres", DATOS.resumen.artistasEnSitioLibre, "var(--c-artista)", filtro.tipo === "libres", () => ponerFiltro("libres", null), "eventos sin ficha de lugar; se colocan en ese sitio"));
  li(fila("Sin conexión", DATOS.resumen.artistasSueltos, "var(--c-suelto)", filtro.tipo === "sueltos", () => ponerFiltro("sueltos", null), "ni evento ni lugar: anillo exterior"));
  li(fila("Asistentes", DATOS.personas.length, "var(--c-persona)", filtro.tipo === "persona", () => ponerFiltro("persona", null), "anónimos; solo quienes dijeron Voy o Me interesa"));
  arbol.replaceChildren();
  const h = document.createElement("h2"); h.textContent = "Filtrar"; arbol.append(h, ul);
  const h2 = document.createElement("h2"); h2.textContent = "Ajustes"; arbol.append(h2);
  arbol.insertAdjacentHTML("beforeend", `
    <label class="ajuste"><span>Tamaño de las esferas</span><input type="range" id="aj-tamano" min="0.4" max="2.2" step="0.1" value="${factorTamano}"></label>
    <label class="ajuste"><span>Altura de las capas</span><input type="range" id="aj-altura" min="0" max="2" step="0.1" value="${factorAltura}"></label>
    <label class="ajuste"><span>Mostrar sin conexión</span><input type="checkbox" id="aj-sueltos" ${mostrarSueltos ? "checked" : ""}></label>
    <p class="nota">Lugares a escala real: 1 unidad = 10 m desde el centro de los lugares de San Luis Potosí; cada anillo del suelo es 1 km. Lo que está a más de 10 km (San Miguel de Allende) se acerca en logaritmo para que quepa.</p>
    <p class="nota">Datos reales de solo lectura del ${DATOS.extraido}: ${DATOS.resumen.eventos} eventos, ${DATOS.resumen.seguimientos} seguimientos, ${DATOS.resumen.asistencias} asistencias. Los seguimientos solo suman al tamaño; las personas que solo siguen (${DATOS.resumen.personasQueSiguen - DATOS.personas.length}) no se dibujan.</p>`);
  arbol.querySelector("#aj-tamano").oninput = (e) => { factorTamano = +e.target.value; pintar(); };
  arbol.querySelector("#aj-altura").oninput = (e) => { factorAltura = +e.target.value; pintar(); };
  arbol.querySelector("#aj-sueltos").onchange = (e) => { mostrarSueltos = e.target.checked; pintar(); pintarLista(); };
}
function ponerFiltro(tipo, clase) { filtro = { tipo, clase }; if (seleccion >= 0 && !pasaFiltro(nodos[seleccion])) seleccion = -1, resaltados = new Set(), pintarTarjeta(); pintarArbol(); pintar(); pintarLista(); if (window.innerWidth < 792) cerrarHojas(); }

// ---------- Lista (derecha): lo filtrado, de mayor a menor ----------
const lista = document.getElementById("lista");
function pintarLista() {
  const idx = []; for (let i = 0; i < nodos.length; i++) if (visible[i]) idx.push(i);
  idx.sort((a, b) => radio(nodos[b]) - radio(nodos[a]) || nodos[a].nombre.localeCompare(nodos[b].nombre, "es"));
  const titulo = !filtro.tipo ? "Todo" : filtro.tipo === "lugar" ? (filtro.clase ? ETIQUETA[filtro.clase] : "Lugares") : filtro.tipo === "artista" ? (filtro.clase === "conectados" ? "Artistas con lugar" : filtro.clase ? ETIQUETA[filtro.clase] : "Artistas") : filtro.tipo === "libres" ? "Solo en sitios libres" : filtro.tipo === "sueltos" ? "Sin conexión" : "Asistentes";
  const h = document.createElement("h2"); h.textContent = `${titulo} · ${idx.length}`;
  const ul = document.createElement("ul"); const tope = 400;
  for (const i of idx.slice(0, tope)) {
    const n = nodos[i]; const c = n.tipo === "persona" ? "var(--c-persona)" : n.tipo === "lugar" ? "var(--c-lugar)" : n.suelto ? "var(--c-suelto)" : "var(--c-artista)";
    const sub = n.tipo === "lugar" ? `${ETIQUETA[n.clase] || n.clase} · ${n.seguidores} siguen · ${n.asistentes} van` : n.tipo === "artista" ? `${ETIQUETA[n.clase] || n.clase} · ${n.seguidores} siguen · ${n.asistentes} van` : `actividad ${["baja", "media", "alta"][n.tramo - 1]}`;
    const b = fila(n.nombre, vecinos[i].length, c, false, () => { seleccionar(i, true); if (window.innerWidth < 792) cerrarHojas(); }, sub);
    if (i === seleccion) b.setAttribute("aria-current", "true");
    const li = document.createElement("li"); li.append(b); ul.append(li);
  }
  lista.replaceChildren(h, ul);
  if (idx.length > tope) { const p = document.createElement("p"); p.className = "nota"; p.textContent = `Se muestran ${tope} de ${idx.length}.`; lista.append(p); }
  const sel = lista.querySelector('[aria-current="true"]'); if (sel) sel.scrollIntoView({ block: "nearest" });
}

// ---------- Hojas en el teléfono ----------
const app = document.getElementById("app");
function cerrarHojas() { delete app.dataset.hoja; }
document.getElementById("abrir-arbol").onclick = () => { app.dataset.hoja = "arbol"; };
document.getElementById("abrir-lista").onclick = () => { app.dataset.hoja = "lista"; };
document.getElementById("velo").onclick = cerrarHojas;

// ---------- Tema ----------
const botonTema = document.getElementById("tema");
botonTema.onclick = () => { const claro = document.documentElement.dataset.tema !== "claro"; document.documentElement.dataset.tema = claro ? "claro" : "oscuro"; botonTema.textContent = claro ? "Oscuro" : "Claro"; botonTema.setAttribute("aria-pressed", String(claro)); leerTema(); pintar(); };

// ---------- Cifras, fps y bucle de dibujo (solo cuando algo cambia) ----------
document.getElementById("cifras").textContent = `${nodos.length} nodos · ${aristas.length} conexiones · ${DATOS.lugares.length} lugares · ${DATOS.artistas.length} artistas · ${DATOS.personas.length} asistentes`;
const fpsEl = document.getElementById("fps"); let cuadros = 0, t0 = performance.now();
let pendiente = false;
function pedirCuadro() { if (!pendiente) { pendiente = true; requestAnimationFrame(cuadro); } }
function cuadro(t) {
  pendiente = false;
  if (animacion) { animacion(t); pedirCuadro(); }
  colocarCamara(); renderer.render(escena, camara); pintarRotulos();
  cuadros++; if (t - t0 >= 1000) { fpsEl.textContent = cuadros >= 8 ? `${Math.round(cuadros * 1000 / (t - t0))} fps` : "en reposo"; cuadros = 0; t0 = t; } // se dibuja solo cuando algo cambia: sin movimiento no hay cuadros que contar
  if (window.__medirFps) pedirCuadro(); // para medir: fuerza un cuadro por refresco
}
function redimensionar() { const r = lienzo.parentElement.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camara.aspect = r.width / r.height; camara.updateProjectionMatrix(); pedirCuadro(); }
window.addEventListener("resize", redimensionar);
window.medirFps = (ms = 3000) => new Promise((res) => { window.__medirFps = true; const c0 = cuadros, t = performance.now(); let total = 0; const inicio = performance.now(); const cuenta = () => { total++; if (performance.now() - inicio < ms) requestAnimationFrame(cuenta); else { window.__medirFps = false; res(Math.round(total * 1000 / (performance.now() - inicio))); } }; requestAnimationFrame(cuenta); pedirCuadro(); });
window.grafo = { nodos, aristas, seleccionar, ponerFiltro, cam, pedirCuadro, THREE, escena, renderer, camara };
// Para medir: cuánto tarda la CPU en mandar n cuadros seguidos (ms por cuadro), y cuántas esferas más aguanta la escena.
window.medirRender = (n = 60) => { colocarCamara(); const t = performance.now(); for (let i = 0; i < n; i++) renderer.render(escena, camara); return +((performance.now() - t) / n).toFixed(2); };
window.estresar = (extra) => { const g = new THREE.InstancedMesh(geo, mat, extra); const m = new THREE.Matrix4(); for (let i = 0; i < extra; i++) { const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * 900; m.makeScale(4, 4, 4).setPosition(r * Math.cos(a), (Math.random() - 0.5) * 300, r * Math.sin(a)); g.setMatrixAt(i, m); g.setColorAt(i, colores.artista); } g.frustumCulled = false; g.name = "estres"; escena.add(g); pedirCuadro(); return extra; };
window.quitarEstres = () => { for (const o of [...escena.children]) if (o.name === "estres") escena.remove(o); pedirCuadro(); };

leerTema(); redimensionar(); pintarArbol(); pintar(); pintarLista();
</script>
